<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>My Fit Journal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Concepto: barra lateral en ordenador y barra inferior en móvil; contenido en tarjetas con anillos y barras como protagonistas. Crema y blanco roto de base, arena para lo secundario, marrón suave solo para acentos. */
:root{
  --bg:#F5EFE6; --surface:#FFFDF8; --surface-2:#FAF5EC;
  --line:#E8DECD; --sand:#EDE3D2; --sand-strong:#D6C4A5; --beige:#C9B393;
  --brown:#7B5B43; --accent-text:#5C4130; --on-brown:#FFFDF8;
  --fg:#2F251D; --muted:#7A6B5E;
  --protein:#7B5B43; --carbs:#C7A268; --fat:#9AA68B;
  --danger:#A8493D; --on-danger:#FFFFFF; --ok:#5E8260;
  --toast-bg:#3A2C21; --toast-fg:#FAF5EC;
  --font-display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1713; --surface:#241F19; --surface-2:#2B251E;
    --line:#3A3228; --sand:#342D24; --sand-strong:#5A4D3D; --beige:#7A6850;
    --brown:#D4AE88; --accent-text:#E6C7A6; --on-brown:#1B1713;
    --fg:#F2EADF; --muted:#A99B8B;
    --protein:#D4AE88; --carbs:#C7A268; --fat:#9AAA8C;
    --danger:#D9786B; --on-danger:#1B1713; --ok:#8DB48F;
    --toast-bg:#F2EADF; --toast-fg:#2F251D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1713; --surface:#241F19; --surface-2:#2B251E;
  --line:#3A3228; --sand:#342D24; --sand-strong:#5A4D3D; --beige:#7A6850;
  --brown:#D4AE88; --accent-text:#E6C7A6; --on-brown:#1B1713;
  --fg:#F2EADF; --muted:#A99B8B;
  --protein:#D4AE88; --carbs:#C7A268; --fat:#9AAA8C;
  --danger:#D9786B; --on-danger:#1B1713; --ok:#8DB48F;
  --toast-bg:#F2EADF; --toast-fg:#2F251D;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.locked{overflow:hidden}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,38px);line-height:1.1;font-weight:600}
h2{font-size:18px;line-height:1.3;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none}

/* ---------- Estructura ---------- */
.app{max-width:1240px;margin:0 auto}
.side{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
}
.brand,.side-foot{display:none}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:500;min-width:0}
.nav a .nav-ic{display:grid;place-items:center;padding:4px 14px;border-radius:999px}
.nav a[aria-current="page"]{color:var(--accent-text);font-weight:600}
.nav a[aria-current="page"] .nav-ic{background:var(--sand)}
.main{padding-block:16px calc(104px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;min-width:0}
.mbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.wm{font:500 19px var(--font-display);letter-spacing:-.01em}
.wm b{font-weight:700}
.mark{flex:none}
.mk-track{fill:none;stroke:var(--sand-strong);stroke-width:3}
.mk-arc{fill:none;stroke:var(--brown);stroke-width:3;stroke-linecap:round}
.mk-dot{fill:var(--brown)}

@media (min-width:900px){
  body{padding-block:0}
  .app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:48px}
  .side{
    position:sticky;top:0;left:auto;right:auto;bottom:auto;align-self:start;height:100vh;
    background:transparent;border-top:0;padding:28px 0;display:flex;flex-direction:column;gap:32px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav a{flex-direction:row;gap:12px;padding:10px 12px;font-size:15px;border-radius:12px}
  .nav a .nav-ic{padding:0;background:none!important}
  .nav a:hover{background:var(--sand)}
  .nav a[aria-current="page"]{background:var(--sand)}
  .side-foot{display:flex;flex-direction:column;gap:12px;margin-top:auto;align-items:flex-start}
  .main{max-width:none;margin:0;padding-block:32px 48px}
  .mbar{display:none}
}
.store{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--beige);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)}

/* ---------- Componentes ---------- */
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.eyebrow{font:600 12px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--brown);color:var(--on-brown)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.ghost:hover{background:var(--sand)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.small{min-height:36px;padding:0 14px;font-size:13px}
.btn:disabled,.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--sand);color:var(--fg)}
.icon-btn.bordered{border-color:var(--line);color:var(--fg)}
.icon-btn.sm{width:34px;height:34px}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;color:var(--accent-text);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.chip-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer}
.chip-btn:hover{background:var(--sand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sub{font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:16px}
.note b{color:var(--fg)}
.stack{display:grid;gap:16px}
.empty{display:grid;gap:12px;justify-items:start;color:var(--muted);padding:8px 0}
.banner{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;background:var(--sand);border:1px dashed var(--beige);border-radius:16px;padding:12px 16px;margin-bottom:20px;font-size:14px}
.banner p{flex:1 1 280px;min-width:0}
.banner.warn{border-color:var(--danger);border-style:solid}
.badge-demo{display:inline-block;font:600 10px var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px dashed var(--beige);background:var(--sand);color:var(--muted);margin-left:8px;vertical-align:2px;white-space:nowrap}
.banner .badge-demo{margin:0}

.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  .dash{grid-template-columns:repeat(12,minmax(0,1fr))}
  .c-food{grid-column:span 7}.c-train{grid-column:span 5}
  .c-weight{grid-column:span 5}.c-week{grid-column:span 7}

const e1=s=>s.kg>0?s.kg*(1+s.reps/30):0;
function exMetric(sets){
  if(sets.some(s=>s.kg>0)){const b=sets.reduce((a,s)=>e1(s)>e1(a)?s:a);return {m:e1(b),best:b,kg:true};}
  const b=sets.reduce((a,s)=>s.reps>a.reps?s:a);return {m:b.reps,best:b,kg:false};
}
let AN={};
function analysis(){
  const out={},last={},mx={};
  W().slice().sort(byAsc).forEach(w=>w.exercises.forEach((e,i)=>{
    const k=key(e.name),cur=exMetric(e.sets),prev=last[k];let st='new';
    if(prev){
      if(cur.m>mx[k]*1.0001)st='pr';
      else if(cur.m>prev.m*1.005)st='up';
      else if(cur.m<prev.m*0.995)st='down';
      else st='same';
    }
    out[w.id+':'+i]={cur:cur,prev:prev||null,status:st,date:w.date};
    last[k]={m:cur.m,best:cur.best,kg:cur.kg,date:w.date};
    mx[k]=Math.max(mx[k]||0,cur.m);
  }));
  return out;
}

function niceScale(min,max){
  if(min===max){min-=1;max+=1;}
  const raw=(max-min)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),nr=raw/mag;
  const step=(nr<=1?1:nr<=2?2:nr<=2.5?2.5:nr<=5?5:10)*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,ticks=[];
  for(let v=lo;v<=hi+step/2;v+=step)ticks.push(+v.toFixed(6));
  return {ticks:ticks,lo:lo,hi:hi};
}

    (pct>0?'<circle class="ring-val" cx="'+h+'" cy="'+h+'" r="'+r+'" stroke-width="'+stroke+'" stroke-dasharray="'+(c*pct).toFixed(2)+' '+c.toFixed(2)+'" transform="rotate(-90 '+h+' '+h+')"/>':'')+'</svg>';
}
function barsSvg(s,w){
  const h=s.h,padT=22,padB=26,padX=4,n=s.items.length,plotH=h-padT-padB,band=(w-padX*2)/n,bw=Math.min(band*.6,40);
  const max=Math.max(1,Math.max.apply(null,s.items.map(i=>i.value)),s.goal||0)*1.08;
  const base=padT+plotH;
  let g='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><line class="ch-base" x1="0" x2="'+w+'" y1="'+base+'" y2="'+base+'"/>';
  if(s.goal){const gy=base-(s.goal/max)*plotH;g+='<line class="ch-goal" x1="0" x2="'+w+'" y1="'+gy+'" y2="'+gy+'"/>';}
  s.items.forEach((it,i)=>{
    const cx=padX+band*i+band/2,bh=it.value>0?Math.max(3,(it.value/max)*plotH):0,by=base-bh;
    if(bh>0)g+='<rect class="ch-bar'+(it.hi?' hi':'')+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="5"/>';
    g+='<text class="ch-val" x="'+cx.toFixed(1)+'" y="'+(by-6).toFixed(1)+'" text-anchor="middle">'+(it.value>0?esc(s.fmt(it.value)):'–')+'</text>';
    g+='<text class="ch-lab'+(it.hi?' hi':'')+'" x="'+cx.toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle">'+esc(it.label)+'</text>';
  });
  return g+'</svg>';
}
function lineSvg(s,w){
  const h=s.h,mini=!!s.mini,m=mini?{l:6,r:8,t:8,b:8}:{l:44,r:16,t:18,b:26};
  const pts=s.pts,n=pts.length;
  let vmin=Math.min.apply(null,pts.map(p=>p.v)),vmax=Math.max.apply(null,pts.map(p=>p.v));
  if(s.goal!=null){vmin=Math.min(vmin,s.goal);vmax=Math.max(vmax,s.goal);}
  let ticks=[],lo,hi;
  if(mini){const pd=(vmax-vmin||1)*.25;lo=vmin-pd;hi=vmax+pd;}
  else{const ns=niceScale(vmin,vmax);ticks=ns.ticks;lo=ns.lo;hi=ns.hi;}
  const t0=pts[0].t,t1=pts[n-1].t,span=t1-t0,pw=w-m.l-m.r,base=h-m.b;
  const X=t=>(n===1||span===0)?m.l+pw/2:m.l+((t-t0)/span)*pw;
  const Y=v=>m.t+(h-m.t-m.b)*(1-(v-lo)/((hi-lo)||1));
  const xs=pts.map(p=>X(p.t)),ys=pts.map(p=>Y(p.v));
  let g='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><defs><linearGradient id="g-'+s.id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="st1"/><stop offset="1" class="st2"/></linearGradient></defs>';
  ticks.forEach(v=>{const y=Y(v);g+='<line class="ch-grid" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="ch-tick" x="'+(m.l-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+esc(s.fmt(v))+'</text>';});
  if(s.goal!=null){const y=Y(s.goal);g+='<line class="ch-goal" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';}
  if(n>1){
    const d=xs.map((x,i)=>(i?'L':'M')+x.toFixed(1)+' '+ys[i].toFixed(1)).join(' ');
    g+='<path d="'+d+' L'+xs[n-1].toFixed(1)+' '+base+' L'+xs[0].toFixed(1)+' '+base+' Z" fill="url(#g-'+s.id+')"/><path class="ch-line" d="'+d+'"/>';
  }
  if(!mini){
    if(n<=24&&n>1)for(let i=0;i<n-1;i++)g+='<circle class="ch-pt" cx="'+xs[i].toFixed(1)+'" cy="'+ys[i].toFixed(1)+'" r="2.6"/>';
    if(span>0){
      const k=Math.min(w<420?3:5,Math.max(2,Math.floor(pw/90)));
      for(let i=0;i<k;i++){const t=t0+span*i/(k-1);g+='<text class="ch-tick" x="'+X(t).toFixed(1)+'" y="'+(h-6)+'" text-anchor="'+(i===0?'start':i===k-1?'end':'middle')+'">'+esc(shortDate(fmt(new Date(t))))+'</text>';}
    }else g+='<text class="ch-tick" x="'+xs[0].toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle">'+esc(shortDate(fmt(new Date(t0))))+'</text>';
  }
  const ex=xs[n-1],ey=ys[n-1];
  g+='<circle class="ch-ring" cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="9"/><circle class="ch-dot" cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="4.5"/>';
  if(!mini){
    const ly=ey-14<12?ey+24:ey-14;
    g+='<text class="ch-val" x="'+ex.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="end">'+esc(s.fmt(pts[n-1].v))+'</text>';
    g+='<g class="ch-hv" display="none"><line class="ch-vline" x1="0" x2="0" y1="'+m.t+'" y2="'+base+'"/><circle class="ch-dot" cx="0" cy="0" r="5"/></g>';
  }
  return {svg:g+'</svg>',xs:xs,ys:ys};
}
function bindHover(el,spec,r){
  const hv=$('.ch-hv',el),tip=$('.ch-tip',el);
  if(!hv||!tip)return;
  const vl=$('line',hv),dot=$('circle',hv);
  const show=e=>{
    const rect=el.getBoundingClientRect(),px=e.clientX-rect.left;
    let bi=0,bd=1e9;
    r.xs.forEach((x,i)=>{const d=Math.abs(x-px);if(d<bd){bd=d;bi=i;}});
    const x=r.xs[bi],y=r.ys[bi];
    hv.setAttribute('display','');
    vl.setAttribute('x1',x);vl.setAttribute('x2',x);dot.setAttribute('cx',x);dot.setAttribute('cy',y);
    tip.hidden=false;tip.textContent=spec.pts[bi].tip;
    tip.style.left=Math.max(60,Math.min(rect.width-60,x))+'px';tip.style.top=Math.max(26,y-12)+'px';
  };
  el.onpointermove=show;el.onpointerdown=show;
  el.onpointerleave=e=>{if(e.pointerType==='mouse'){hv.setAttribute('display','none');tip.hidden=true;}};
}
function drawCharts(){
  $$('.chart[data-chart]').forEach(el=>{
    const s=charts[el.dataset.chart];if(!s)return;
    const w=Math.floor(el.clientWidth);if(w<60)return;
    if(s.type==='bars'){el.innerHTML=barsSvg(s,w);}

      const r=lineSvg(s,w);
      el.innerHTML=r.svg+(s.mini?'':'<div class="ch-tip" hidden></div>');
      if(!s.mini)bindHover(el,s,r);
    }
  });
}

function vTrain(){
  const t=today(),g=db.settings,ws=weekStart(t),we=addDays(ws,6),all=W(),cw=cardioWeek(ws),rts=R();

  const plan=WD.map((d,i)=>{
    const date=addDays(ws,i),rs=rts.filter(r=>r.day===d);

  const rutinas='<section class="card"><div class="card-head"><h2>Mis rutinas</h2><button type="button" class="btn ghost small" data-action="new-routine">'+ic('plus',16)+'Nueva rutina</button></div>'+
    (rts.length?'<ul class="list">'+rts.map(r=>'<li class="row"><div class="row-main"><div class="row-title">'+esc(r.name)+demoBadge(r)+'</div><div class="row-sub">'+r.exercises.length+' '+pl(r.exercises.length,'ejercicio','ejercicios')+' · '+(r.day==null?'Sin día fijo':WDN[r.day])+(r.programId?' · Programa activo':'')+'</div></div><div class="row-actions"><button type="button" class="icon-btn" data-action="start-routine-id" data-id="'+r.id+'" aria-label="Empezar rutina" title="Empezar">'+ic('play')+'</button>'+actBtns('routines',r.id,false)+'</div></li>').join('')+'</ul><p class="note">«Empezar» abre una sesión con tus últimas cargas ya rellenas para que veas qué toca superar.</p>':
      '<div class="empty"><p>Crea rutinas con tus ejercicios y asígnales un día de la semana. También puedes guardar una sesión ya registrada como rutina desde el historial.</p><button type="button" class="btn ghost" data-action="new-routine">'+ic('plus',16)+'Crear la primera</button></div>')+
    (Object.keys(hist).length?'<div class="group-title" style="margin-top:22px"><span>Repetir una sesión anterior</span></div><div class="routines">'+Object.keys(hist).map(k=>'<button type="button" class="chip-btn" data-action="start-routine" data-name="'+esc(k)+'">'+ic('plus',14)+esc(k)+' <span class="sub">('+hist[k]+')</span></button>').join('')+'</div>':'')+'</section>';
  /* Progreso por ejercicio */
  const exMap={};
  all.forEach(w=>w.exercises.forEach(e=>{const k=key(e.name);if(!exMap[k])exMap[k]={key:k,name:e.name.trim(),n:0};exMap[k].n++;}));
  const exList=Object.keys(exMap).map(k=>exMap[k]).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,'es'));
  if(!ui.exercise||!exMap[ui.exercise])ui.exercise=exList.length?exList[0].key:null;
  let progress='';
  if(!exList.length){progress='<div class="empty"><p>Registra un entrenamiento para ver tu progreso por ejercicio.</p></div>';}
  else{
    const rows=[];
    all.slice().sort(byAsc).forEach(w=>w.exercises.forEach((e,i)=>{if(key(e.name)===ui.exercise)rows.push({w:w,e:e,a:AN[w.id+':'+i]});}));
    const useKg=rows.some(r=>r.a.cur.kg),unit=useKg?'kg':'reps';
    const val=r=>!useKg?r.a.cur.best.reps:(ui.exMetric==='kg'?Math.max.apply(null,r.e.sets.map(s=>s.kg)):r.a.cur.m);
    const pts=rows.map(r=>({t:parse(r.w.date).getTime(),v:val(r),tip:shortDate(r.w.date)+' · '+n1(val(r))+' '+unit}));
    const top=pts.reduce((a,b)=>b.v>a.v?b:a),change=pts[pts.length-1].v-pts[0].v;
    progress='<div class="fsel" style="margin-bottom:16px"><label class="field"><span>Ejercicio</span><select id="ex-sel">'+exList.map(e=>'<option value="'+esc(e.key)+'"'+(e.key===ui.exercise?' selected':'')+'>'+esc(e.name)+'</option>').join('')+'</select></label>'+
      (useKg?'<div class="field"><span>Medir con</span><div class="seg" role="group" aria-label="Métrica del gráfico">'+[['e1rm','1RM estimado'],['kg','Peso máximo']].map(m=>'<button type="button" data-action="exmetric" data-m="'+m[0]+'" aria-pressed="'+(ui.exMetric===m[0])+'">'+m[1]+'</button>').join('')+'</div></div>':'')+'</div>'+
      '<div class="stats" style="margin-bottom:16px"><div class="stat"><div class="k">Mejor marca</div><div class="v">'+n1(top.v)+' <small>'+unit+'</small></div><div class="s">'+shortDate(fmt(new Date(top.t)))+'</div></div>'+
      '<div class="stat"><div class="k">Cambio</div><div class="v">'+sgn(change)+' <small>'+unit+'</small></div><div class="s">'+(pts.length>1?'desde el '+shortDate(fmt(new Date(pts[0].t))):'Solo hay una sesión')+'</div></div></div>'+

      '<div class="wrap-x" style="margin-top:16px"><table class="meas"><thead><tr><th>Sesión</th><th>Mejor serie</th><th>'+(useKg?'1RM est.':'')+'</th><th></th></tr></thead><tbody>'+rows.slice(-6).reverse().map(r=>'<tr><td>'+shortDate(r.w.date)+'</td><td>'+esc(bestStr(r.a.cur))+'</td><td>'+(useKg?n1(r.a.cur.m)+' kg':'')+'</td><td>'+pill(r.a)+'</td></tr>').join('')+'</tbody></table></div>';
  }
  const weeks=Array.from({length:6},(_,i)=>addDays(ws,-7*(5-i)));
  const wbars=weeks.map(s=>({label:shortDate(s),value:all.filter(w=>w.date>=s&&w.date<=addDays(s,6)).reduce((a,w)=>a+wVol(w),0),hi:s===ws}));
  /* Grupos musculares */
  const gs=groupStats(),vg=GROUPS.filter(x=>gs.res[x].sets.some(v=>v>0)||g.focus.indexOf(x)>=0);
  if(!ui.group||vg.indexOf(ui.group)<0)ui.group=vg[0]||null;
  const grows=vg.map(x=>{

  }).join('');
  const gbars=ui.group?gs.weeks.map((s,i)=>({label:shortDate(s),value:gs.res[ui.group].sets[i],hi:i===7})):[];
  const gcard='<section class="card"><div class="card-head"><h2>Evolución por grupo muscular</h2><span class="sub">Series por semana y tendencia de fuerza</span></div>'+
    (vg.length?'<div class="two"><div>'+grows+'</div><div><h3 style="margin-bottom:8px">'+esc(ui.group)+': series por semana</h3>'+chartBox('grp8',{type:'bars',h:200,items:gbars,fmt:n0},'Series semanales de '+ui.group)+'</div></div><p class="note">La tendencia de fuerza compara el primer y el último registro de cada ejercicio del grupo en las últimas 8 semanas (1RM estimado). Las zonas de foco se eligen en tu perfil.</p>':'<div class="empty"><p>Registra entrenamientos para ver el volumen y la fuerza de cada grupo muscular.</p></div>')+'</section>';
  /* Mejoras */
  const gains=recentGains(60).slice(0,8);
  const gcard2='<section class="card"><div class="card-head"><h2>Mejoras y récords</h2><span class="sub">Últimos 60 días</span></div>'+
    (gains.length?'<ul class="list">'+gains.map(x=>'<li class="row"><div class="row-main"><div class="row-title">'+esc(x.e.name)+' '+pill(x.a)+'</div><div class="row-sub">'+dayLabel(x.w.date)+' · '+bestStr(x.a.cur)+(x.a.prev?' · antes '+bestStr(x.a.prev)+' ('+shortDate(x.a.prev.date)+')':'')+'</div></div></li>').join('')+'</ul><p class="note"><b>Récord</b> es tu mejor marca de ese ejercicio. <b>Mejora</b> supera la sesión anterior sin llegar al récord.</p>':'<div class="empty"><p>Aquí verás cuándo superas tu rendimiento anterior en un ejercicio.</p></div>')+'</section>';
  /* Cardio */
  const cl=C(),cbars=weeks.map(s=>({label:shortDate(s),value:cl.filter(c=>c.date>=s&&c.date<=addDays(s,6)).reduce((a,c)=>a+c.min,0),hi:s===ws}));

  '<div class="strip"><div class="stat"><div class="k">Fuerza esta semana</div><div class="v">'+wk.length+' <small>de '+g.perWeek+' '+pl(g.perWeek,'sesión','sesiones')+'</small></div></div>'+
    '<div class="stat"><div class="k">Volumen semanal</div><div class="v">'+n0(wkVol)+' <small>kg</small></div></div>'+

function photosBlock(){

  if(photosState==='loading')return '<p class="sub">Cargando fotos…</p>';
  const ps=photos.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0));

function saveWorkout(f){
  clearErr(f);const E=f.elements;
  const date=E.date.value,name=E.routine.value.trim();
  if(!date)return setErr(f,'Elige la fecha del entrenamiento.',E.date);
  if(!name)return setErr(f,'Escribe el nombre de la rutina, por ejemplo «Glúteo y pierna».',E.routine);
  const dur=E.duration.value===''?null:parseInt(E.duration.value,10);
  if(dur!==null&&!(dur>0))return setErr(f,'La duración debe ser un número de minutos mayor que 0.',E.duration);
  const exs=[],blocks=$$('.ex',f);
  for(const b of blocks){
    const ni=$('.ex-name',b),en=ni.value.trim(),sets=[];let touched=!!en;
    for(const r of $$('.set',b)){
      const ri=$('.s-reps',r),ki=$('.s-kg',r);
      if(ri.value===''&&ki.value==='')continue;
      touched=true;
      const reps=parseInt(ri.value,10),kg=ki.value===''?0:parseFloat(ki.value);
      if(!(reps>0))return setErr(f,'Cada serie necesita un número de repeticiones mayor que 0.',ri);
      if(!(kg>=0))return setErr(f,'El peso no puede ser negativo.',ki);
      sets.push({reps:reps,kg:kg});
    }
    if(!touched)continue;
    if(!en)return setErr(f,'Falta el nombre de un ejercicio.',ni);
    if(!sets.length)return setErr(f,'Añade al menos una serie a «'+en+'».',$('.s-reps',b));
    exs.push({name:en,group:$('.ex-group',b).value,sets:sets});
  }
  if(!exs.length)return setErr(f,'Añade al menos un ejercicio con sus series.',$('.ex-name',blocks[0]));
  const id=f.dataset.id,rec=id?db.workouts.find(w=>w.id===id):null;
  const data={date:date,name:name,duration:dur,notes:E.notes.value.trim(),exercises:exs};
  let lk=null;try{lk=f.dataset.link?JSON.parse(f.dataset.link):null;}catch(e){lk=null;}
  if(rec)Object.assign(rec,data);else db.workouts.push(Object.assign({id:uid(),demo:false,createdAt:Date.now()},data,lk?{programId:lk.programId,sessionId:lk.sessionId,routineId:lk.routineId}:{}));
  save();closeSheet();render();toast('Entrenamiento guardado');
}

function saveRoutine(f){
  clearErr(f);const E=f.elements,name=E.rname.value.trim();
  if(!name)return setErr(f,'Escribe un nombre para la rutina.',E.rname);
  const exs=[];
  for(const b of $$('.ex',f)){

    exs.push({name:en,group:$('.ex-group',b).value,sets:s,reps:r});
  }
  if(!exs.length)return setErr(f,'Añade al menos un ejercicio a la rutina.',$('.ex-name',f));

}

function defaultType(){const h=new Date().getHours();return h<11?'Desayuno':h<16?'Comida':h<19?'Merienda':'Cena';}
function itemRow(it){
  const o=it||{name:'',g:'',k:'',p:'',c:'',f:''},fixed=it&&it.name?JSON.stringify({k:o.k,p:o.p,c:o.c,f:o.f}):'';
  const fld=(c,l)=>'<label class="field"><span>'+l+'</span><input class="o-'+c+'" type="number" min="0" max="1000" step="0.1" inputmode="decimal"></label>';
  return '<div class="it" data-fixed="'+esc(fixed)+'" data-fname="'+esc(key(o.name))+'"><div class="it-top"><input class="it-name" list="dl-food" maxlength="60" autocomplete="off" placeholder="Alimento" aria-label="Alimento" value="'+esc(o.name)+'"><input class="it-g" type="number" min="1" max="5000" step="1" inputmode="decimal" placeholder="g" aria-label="Cantidad en gramos" value="'+(o.g===''?'':o.g)+'"><button type="button" class="icon-btn sm" data-action="remove-item" aria-label="Quitar alimento">'+ic('x',14)+'</button></div>'+
    '<p class="sub it-info"></p><div class="it-own" hidden>'+fld('k','kcal/100 g')+fld('p','Prot./100 g')+fld('c','Carb./100 g')+fld('f','Grasa/100 g')+'<label class="chk" style="grid-column:1/-1"><input type="checkbox" class="o-save"> Guardar en mis alimentos</label></div></div>';
}
function rowPer(row){
  const name=$('.it-name',row).value.trim(),k=key(name);
  if(!name)return null;
  if(row.dataset.fixed&&row.dataset.fname===k){const x=JSON.parse(row.dataset.fixed);return {k:x.k,p:x.p,c:x.c,f:x.f,src:'fixed'};}
  const fd=findFood(name);if(fd)return {k:fd.kcal,p:fd.p,c:fd.c,f:fd.f,src:'lib'};
  const v={};['k','p','c','f'].forEach(x=>{v[x]=numOf($('.o-'+x,row));});
  if(v.k===null&&v.p===null&&v.c===null&&v.f===null)return {src:'own',none:true};
  const p=v.p||0,c=v.c||0,f=v.f||0;
  return {k:v.k===null?4*p+4*c+9*f:v.k,p:p,c:c,f:f,src:'own'};
}
function refreshItem(row){
  const per=rowPer(row),g=numOf($('.it-g',row)),info=$('.it-info',row),name=$('.it-name',row).value.trim();
  $('.it-own',row).hidden=!(per&&per.src==='own');
  if(!per){info.textContent='';return null;}
  if(per.none){info.textContent='Alimento nuevo: indica sus valores por 100 g.';return null;}
  if(!(g>0)){info.textContent=per.src==='lib'?'Por 100 g: '+n0(per.k)+' kcal · P '+n1(per.p)+' · C '+n1(per.c)+' · G '+n1(per.f):'';return null;}
  const m=g/100;
  info.textContent='= '+n0(per.k*m)+' kcal · P '+n1(per.p*m)+' g · C '+n1(per.c*m)+' g · G '+n1(per.f*m)+' g';
  return {name:name,g:g,k:per.k,p:per.p,c:per.c,f:per.f};
}
function refreshMeal(f){
  const E=f.elements,items=$$('.it',f).map(refreshItem).filter(Boolean),has=items.length>0;
  ['kcal','p','c','f'].forEach(k=>{E[k].disabled=has;});
  let tk,tp,tc,tf;
  if(has){const s=sumItems(items);tk=s.kcal;tp=s.p;tc=s.c;tf=s.f;}
  else{tp=numOf(E.p)||0;tc=numOf(E.c)||0;tf=numOf(E.f)||0;const k=numOf(E.kcal);tk=k!==null?k:4*tp+4*tc+9*tf;}
  $('#meal-total').textContent=(tk>0||tp>0)?'Total: '+n0(tk)+' kcal · P '+n1(tp)+' g · C '+n1(tc)+' g · G '+n1(tf)+' g':'';
  $('#kcal-hint').textContent=has?'Con alimentos pesados, las calorías se calculan automáticamente.':'';
}

    '<label class="field"><span>Calorías (kcal) <span class="hint">· vacío = se calcula con los macros</span></span><input type="number" name="kcal" min="0" max="10000" step="1" inputmode="numeric" placeholder="Automático" value="'+(manual&&s.kcal!==''?s.kcal:'')+'"></label><p class="sub" id="kcal-hint"></p></div></details>'+
    (fav?'':'<label class="chk" style="margin-top:16px"><input type="checkbox" name="savefav"> Guardar como comida habitual</label>')+
    actionsHtml()+'</form>');
  refreshMeal($('form[data-form=meal]'));
}
function saveMeal(f){
  clearErr(f);const E=f.elements,fav=!!f.dataset.fav;
  const date=fav?null:E.date.value,typedName=E.mname.value.trim();
  if(!fav&&!date)return setErr(f,'Elige la fecha.',E.date);
  const items=[],ownSave=[];
  for(const row of $$('.it',f)){
    const ni=$('.it-name',row),gi=$('.it-g',row),name=ni.value.trim();
    if(!name&&gi.value==='')continue;
    if(!name)return setErr(f,'Falta el nombre de un alimento.',ni);
    const g=numOf(gi);
    if(!(g>0))return setErr(f,'Indica los gramos de «'+name+'».',gi);
    const per=rowPer(row);
    if(!per||per.none)return setErr(f,'Indica los valores por 100 g de «'+name+'».',$('.o-k',row));
    items.push({name:name,g:g,k:per.k,p:per.p,c:per.c,f:per.f});
    if(per.src==='own'&&$('.o-save',row).checked)ownSave.push({name:name,kcal:per.k,p:per.p,c:per.c,f:per.f});
  }
  let kcal,P,C,F,name=typedName;
  if(items.length){const s=sumItems(items);kcal=s.kcal;P=s.p;C=s.c;F=s.f;if(!name)name=items.slice(0,3).map(i=>i.name.replace(/ \(.*\)/,'')).join(', ');}
  else{
    const k=numOf(E.kcal),p=numOf(E.p),c=numOf(E.c),fa=numOf(E.f);
    for(const [v,el] of [[k,E.kcal],[p,E.p],[c,E.c],[fa,E.f]])if(v!==null&&!(v>=0))return setErr(f,'Los valores no pueden ser negativos.',el);
    P=p||0;C=c||0;F=fa||0;
    if(k===null&&P+C+F===0)return setErr(f,'Añade al menos un alimento con sus gramos, o indica calorías o macros.',$('.it-name',f)||E.kcal);
    if(!name)return setErr(f,'Escribe el nombre de la comida.',E.mname);
    kcal=Math.round(k!==null?k:4*P+4*C+9*F);
  }
  ownSave.forEach(x=>{if(!findFood(x.name))db.foods.push({id:uid(),name:x.name,kcal:x.kcal,p:x.p,c:x.c,f:x.f,base:false});});
  const id=f.dataset.id,itemsOut=items.length?items:null;
  if(fav){
    const data={type:E.type.value,name:name,items:itemsOut,kcal:kcal,p:P,c:C,f:F},rec=id?db.favorites.find(x=>x.id===id):null;
    if(rec)Object.assign(rec,data);else db.favorites.push(Object.assign({id:uid(),demo:false},data));
    save();closeSheet();render();toast('Comida habitual guardada');return;
  }
  const data={date:date,type:E.type.value,name:name,items:itemsOut,kcal:kcal,p:P,c:C,f:F,planned:E.status.value==='planned'},rec=id?db.meals.find(m=>m.id===id):null;
  if(rec)Object.assign(rec,data);else db.meals.push(Object.assign({id:uid(),demo:false,createdAt:Date.now()},data));
  if(E.savefav&&E.savefav.checked){
    const fd={type:data.type,name:name,items:itemsOut?JSON.parse(JSON.stringify(itemsOut)):null,kcal:kcal,p:P,c:C,f:F},ex=db.favorites.find(x=>key(x.name)===key(name)&&!x.demo);
    if(ex)Object.assign(ex,fd);else db.favorites.push(Object.assign({id:uid(),demo:false},fd));
  }
  if(route==='nutricion')ui.nutDate=date;
  save();closeSheet();render();toast(data.planned?'Comida planificada':'Comida guardada');
}
function addFav(id,date){
  const fv=db.favorites.find(x=>x.id===id);if(!fv)return;
  const m={id:uid(),date:date,type:fv.type||defaultType(),name:fv.name,items:fv.items?JSON.parse(JSON.stringify(fv.items)):null,kcal:fv.kcal,p:fv.p,c:fv.c,f:fv.f,planned:date>today(),demo:false,createdAt:Date.now()};
  db.meals.push(m);save();render();
  toast((m.planned?'Planificada: ':'Añadida: ')+fv.name,()=>{db.meals=db.meals.filter(x=>x.id!==m.id);save();render();});
}

function saveFood(f){
  clearErr(f);const E=f.elements,name=E.fname.value.trim(),id=f.dataset.id;
  if(!name)return setErr(f,'Escribe el nombre del alimento.',E.fname);
  if(db.foods.some(x=>key(x.name)===key(name)&&x.id!==id))return setErr(f,'Ya tienes un alimento con ese nombre.',E.fname);
  const v={};
  for(const k of ['kcal','p','c','f']){v[k]=numOf(E[k]);if(v[k]!==null&&!(v[k]>=0))return setErr(f,'Los valores no pueden ser negativos.',E[k]);}
  if(v.kcal===null&&v.p===null&&v.c===null&&v.f===null)return setErr(f,'Indica las calorías o algún macronutriente por 100 g.',E.kcal);
  const fib=numOf(E.fi);if(fib!==null&&!(fib>=0&&fib<=100))return setErr(f,'La fibra debe estar entre 0 y 100 g.',E.fi);
  const p=v.p||0,c=v.c||0,fa=v.f||0,data={name:name,kcal:v.kcal===null?Math.round(4*p+4*c+9*fa):v.kcal,p:p,c:c,f:fa,fi:fib===null?undefined:fib},rec=id?db.foods.find(x=>x.id===id):null;
  if(rec)Object.assign(rec,data);else db.foods.push(Object.assign({id:uid(),base:false},data));
  save();toast('Alimento guardado');openFoods();
}

function saveBody(f){

  };
  if(c.dismissed&&typeof c.dismissed==='object')Object.keys(c.dismissed).slice(0,50).forEach(k=>{if(isN(c.dismissed[k]))out.dismissed[k.slice(0,80)]=c.dismissed[k];});

  out.archive=arr(c.archive).map(prog).filter(Boolean).slice(0,5).map(p=>{p.status='archived';return p;});
  return out;
}

/* =========================================================
   Escáner de códigos de barras + Open Food Facts
   - La cámara solo se enciende al pulsar «Escanear producto» y se apaga al salir.
   - Los datos del producto vienen de Open Food Facts (OFF). Nada se inventa:
     lo que OFF no trae se deja vacío y se avisa.
   - Funciona solo en una página con HTTPS que no esté dentro de otra web.
   ========================================================= */
const OFF_URL='https://world.openfoodfacts.org/api/v2/product/';
const OFF_FIELDS='code,product_name,product_name_es,generic_name,brands,quantity,image_front_small_url,image_front_url,nutriments';
const SC_LIB_VERSIONS=['3.2.2','3.0.1'];
const SC_FORMATS=['ean_13','ean_8','upc_a'];
const scn={view:'scan',stream:null,det:null,timer:0,busy:false,prod:null,g:100,edit:false,code:'',err:'',ctx:'standalone',cache:{},ctl:null,kind:''};

function eanOk(c){
  if(!/^(\d{8}|\d{12}|\d{13})$/.test(c))return false;
  const d=c.split('').map(Number),chk=d.pop();let s=0;
  for(let i=d.length-1,w=3;i>=0;i--,w=4-w)s+=d[i]*w;
  return (10-s%10)%10===chk;
}
function scanStop(){
  if(scn.timer){clearInterval(scn.timer);scn.timer=0;}
  if(scn.stream){scn.stream.getTracks().forEach(t=>t.stop());scn.stream=null;}
  scn.busy=false;scn.det=null;
  const v=document.getElementById('sc-video');if(v){try{v.pause();}catch(e){}v.srcObject=null;}
}
function scanEnv(){
  if(!window.isSecureContext)return {ok:false,msg:'La cámara solo funciona en páginas seguras (HTTPS) y esta no lo es. Escribe el código a mano.'};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return {ok:false,msg:'Este navegador no permite usar la cámara desde la web. Escribe el código a mano.'};
  let framed=false;try{framed=window.self!==window.top;}catch(e){framed=true;}
  return {ok:true,framed:framed};
}
function camMsg(e){
  const n=e&&e.name;
  if(n==='NotAllowedError'||n==='PermissionDeniedError'||n==='SecurityError')return 'No hay permiso para usar la cámara. Si lo rechazaste, actívalo en los ajustes del sitio de tu navegador y vuelve a intentarlo. Si ves la app dentro de otra página (como Claude), esa página puede bloquear la cámara.';
  if(n==='NotFoundError'||n==='DevicesNotFoundError'||n==='OverconstrainedError')return 'No se ha encontrado ninguna cámara en este dispositivo.';
  if(n==='NotReadableError'||n==='TrackStartError')return 'La cámara está siendo usada por otra aplicación. Ciérrala e inténtalo de nuevo.';
  return 'No se ha podido abrir la cámara'+(n?' ('+n+')':'')+'. Escribe el código a mano.';
}
async function scanDetector(){
  if('BarcodeDetector' in window){
    try{
      const sup=await window.BarcodeDetector.getSupportedFormats();
      if(sup.indexOf('ean_13')>=0)return {det:new window.BarcodeDetector({formats:SC_FORMATS.filter(x=>sup.indexOf(x)>=0)}),kind:'nativo'};
    }catch(e){}
  }
  for(const v of SC_LIB_VERSIONS){
    try{
      const m=await import('https://cdn.jsdelivr.net/npm/barcode-detector@'+v+'/dist/es/ponyfill.min.js');
      return {det:new m.BarcodeDetector({formats:SC_FORMATS}),kind:'ZXing '+v};
    }catch(e){}
  }
  return null;
}

const dash=v=>v===null||v===undefined?'—':n1(v);

  }else if(scn.view==='err'){

function scanSay(msg,isErr){
  const s=$('#sc-status');if(s){s.textContent=msg;s.classList.toggle('err',!!isErr);}
}
async function scanStart(){
  const env=scanEnv();
  if(!env.ok){scanSay(env.msg,true);return;}
  scanStop();
  scanSay('Pidiendo acceso a la cámara…');
  const sb=$('#sc-startbtn');if(sb)sb.disabled=true;
  try{
    scn.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){const b=$('#sc-startbtn');if(b){b.disabled=false;b.lastChild.textContent='Reintentar cámara';}scanSay(camMsg(e),true);return;}
  const v=$('#sc-video');
  if(!v){scanStop();return;}
  v.muted=true;v.srcObject=scn.stream;$('#sc-cam').hidden=false;
  try{await v.play();}catch(e){}
  scanSay('Cargando el lector de códigos…');
  const d=await scanDetector();
  if(!$('#sc-video')){scanStop();return;}
  if(!d){
    scanStop();$('#sc-cam').hidden=true;const b=$('#sc-startbtn');if(b){b.disabled=false;b.lastChild.textContent='Reintentar cámara';}
    scanSay('No se ha podido cargar el lector de códigos (la primera vez necesita conexión). Escribe el código a mano.',true);return;
  }
  scn.det=d.det;scn.kind=d.kind;
  $('#sc-startbtn').hidden=true;$('#sc-stopbtn').hidden=false;
  scanSay('Buscando código… Acerca el envase hasta que las barras llenen el recuadro, con buena luz.');
  scn.timer=setInterval(scanTick,220);
}
async function scanTick(){
  const v=$('#sc-video');
  if(!v||!scn.det){scanStop();return;}
  if(scn.busy||v.readyState<2)return;
  scn.busy=true;
  try{
    const r=await scn.det.detect(v);
    for(const b of r){
      const c=String(b.rawValue||'').trim();
      if(eanOk(c)){scn.busy=false;if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}scanStop();scanLookup(c);return;}
    }
  }catch(e){}
  scn.busy=false;
}

/* ---- Open Food Facts ---- */
const safeImg=u=>typeof u==='string'&&/^https:\/\/[a-z0-9.-]*openfoodfacts\.(org|net)\//i.test(u)?u:'';
function offMap(p,code){
  const n=p.nutriments||{};
  const num=k=>{let v=n[k+'_100g'];if(typeof v==='string'&&v.trim()!=='')v=+v;return typeof v==='number'&&isFinite(v)&&v>=0?v:null;};
  const r1=v=>v===null?null:Math.round(v*10)/10;
  let kcal=num('energy-kcal'),kj=false;
  if(kcal===null){const e=num('energy-kj')!==null?num('energy-kj'):num('energy');if(e!==null){kcal=e/4.184;kj=true;}}
  const q={kcal:kcal===null?null:Math.round(kcal),p:r1(num('proteins')),c:r1(num('carbohydrates')),f:r1(num('fat')),fi:r1(num('fiber'))};
  const name=String(p.product_name_es||p.product_name||p.generic_name||'').trim();
  const doubt=(q.p||0)+(q.c||0)+(q.f||0)>100.5||(q.kcal!==null&&q.kcal>900)||[q.p,q.c,q.f].some(v=>v!==null&&v>100);
  return {code:code,name:name||'Producto sin nombre',noname:!name,brand:String(p.brands||'').split(',')[0].trim().slice(0,60),img:safeImg(p.image_front_small_url||p.image_front_url),qty:String(p.quantity||'').slice(0,40),kcal:q.kcal,p:q.p,c:q.c,f:q.f,fi:q.fi,doubt:doubt,kj:kj};
}
async function offFetch(code,ctl){
  if(scn.cache[code])return scn.cache[code];
  let timedOut=false;const to=setTimeout(()=>{timedOut=true;ctl.abort();},12000);
  try{
    const r=await fetch(OFF_URL+encodeURIComponent(code)+'?fields='+OFF_FIELDS,{signal:ctl.signal});
    if(r.status===404)return {nf:true};
    if(r.status===429||r.status===503){const e=new Error('limit');e.kind='limit';throw e;}
    if(!r.ok){const e=new Error('http');e.kind='http';e.status=r.status;throw e;}
    const j=await r.json();
    if(!j||j.status!==1||!j.product)return {nf:true};
    const p=offMap(j.product,code);scn.cache[code]=p;return p;
  }catch(e){if(timedOut){const t=new Error('timeout');t.kind='timeout';throw t;}throw e;}
  finally{clearTimeout(to);}
}
function offErr(e){
  if(e&&e.kind==='limit')return 'Open Food Facts limita las consultas (unas 15 por minuto). Espera un minuto e inténtalo de nuevo.';
  if(e&&e.kind==='timeout')return 'Open Food Facts tarda demasiado en responder. Inténtalo de nuevo.';
  if(e&&e.kind==='http')return 'Open Food Facts ha respondido con un error ('+e.status+'). Inténtalo más tarde.';
  return 'No se ha podido conectar con Open Food Facts. Comprueba tu conexión. Si ves la app dentro de otra página (como Claude), esa página bloquea las conexiones externas: hay que abrirla desde su propia dirección web.';
}
async function scanLookup(raw){
  const code=String(raw||'').replace(/\D/g,'');
  if(!eanOk(code)){
    const m='El código no es válido: debe tener 8, 12 o 13 cifras y el dígito de control correcto. Revisa los números bajo las barras.';
    const er=$('#sc-err');if(er)er.textContent=m;else{scn.err=m;scn.view='scan';scanShow();}
    return;
  }
  scanStop();
  if(scn.ctl)scn.ctl.abort();
  const ctl=new AbortController();scn.ctl=ctl;
  scn.code=code;scn.view='look';scanShow();
  let res;
  try{res=await offFetch(code.length===12?'0'+code:code,ctl);}
  catch(e){
    if(scn.ctl!==ctl)return;
    scn.ctl=null;scn.err=offErr(e);scn.view='err';scanShow();return;
  }
  if(scn.ctl!==ctl)return;
  scn.ctl=null;
  if(res.nf){scn.view='nf';scanShow();return;}
  const p=Object.assign({},res,{code:code});
  scanRemember(p);
  scanOpenProd(p);
}
function scanRemember(p){
  db.scans=db.scans.filter(x=>x.code!==p.code);
  db.scans.unshift({code:p.code,name:p.name,brand:p.brand,img:p.img||'',kcal:p.kcal,p:p.p,c:p.c,f:p.f,doubt:!!p.doubt,kj:!!p.kj,ts:Date.now()});
  db.scans=db.scans.slice(0,15);save();
}
const scLocal=code=>db.foods.find(x=>x.code===code);
function scanOpenProd(p){
  const loc=scLocal(p.code);
  p=Object.assign({},p);
  if(loc&&loc.edited){p.kcal=loc.kcal;p.p=loc.p;p.c=loc.c;p.f=loc.f;p.edited=true;p.doubt=false;p.kj=false;}
  scn.prod=p;scn.g=(loc&&loc.lastG)||100;scn.edit=missOf(p).length>0||p.doubt;
  scn.view='prod';scanShow();
}
function scanProdHtml(){
  const p=scn.prod,loc=scLocal(p.code),miss=missOf(p);
  const fld=(id,l,v,st)=>'<label class="field"><span>'+l+'</span><input id="'+id+'" type="number" min="0" max="1000" step="'+st+'" inputmode="decimal" value="'+(v===null?'':v)+'"></label>';
  let w='';
  if(miss.length)w+='<div class="warn-box" role="note"><b>Información nutricional incompleta.</b> Faltan: '+miss.join(', ')+'. Complétala con la etiqueta del envase; lo que dejes vacío contará como 0'+(miss.indexOf('calorías')>=0?' y las calorías se estimarán con proteínas, carbohidratos y grasas':'')+'.</div>';
  if(p.doubt)w+='<div class="warn-box" role="note"><b>Valores poco fiables.</b> Parecen incorrectos (por ejemplo, superan 100 g por cada 100 g). Compáralos con la etiqueta y corrígelos.</div>';
  if(p.kj&&!p.edited)w+='<div class="info-box">Las calorías se han calculado a partir de los kJ que figuran en Open Food Facts.</div>';
  if(p.edited)w+='<div class="info-box">Estás usando los valores que corregiste antes para este producto.</div>';
  return '<div class="prod"><div class="prod-img">'+(p.img?'<img src="'+esc(p.img)+'" alt="" referrerpolicy="no-referrer" loading="lazy">':ic('nutricion',26))+'</div>'+
    '<div class="prod-main"><div class="row-title">'+esc(p.name)+'</div><div class="row-sub">'+(p.brand?esc(p.brand):'Sin marca indicada')+(p.qty?' · '+esc(p.qty):'')+'</div><div class="row-sub">Código '+esc(p.code)+'</div></div>'+scStar(loc&&loc.fav)+'</div>'+w+
    '<div class="cfg"><div class="row-sub" id="sc-per100">Por 100 g: '+(p.kcal===null?'—':n0(p.kcal))+' kcal · P '+dash(p.p)+' g · C '+dash(p.c)+' g · G '+dash(p.f)+' g</div>'+
    '<button type="button" class="link" data-action="scan-edit" style="padding:0;justify-self:start"'+(scn.edit?' hidden':'')+' id="sc-editbtn">Corregir valores</button>'+
    '<div id="sc-edit"'+(scn.edit?'':' hidden')+' class="cfg" style="margin:0"><label class="field"><span>Nombre</span><input id="sc-name" maxlength="60" autocomplete="off" value="'+esc(p.name)+'"></label><p class="row-sub" style="margin:0">Valores por cada 100 g</p><div class="frow">'+fld('sc-k','Calorías (kcal)',p.kcal,1)+fld('sc-p','Proteínas (g)',p.p,0.1)+fld('sc-c','Carbohidratos (g)',p.c,0.1)+fld('sc-f','Grasas (g)',p.f,0.1)+'</div></div>'+
    '<label class="field"><span>Cantidad consumida (g)</span><input id="sc-g" type="number" min="1" max="5000" step="1" inputmode="decimal" value="'+scn.g+'"></label>'+
    '<div class="routines">'+[50,100,150,200,250].map(g=>'<button type="button" class="chip-btn" data-action="scan-g" data-g="'+g+'">'+g+' g</button>').join('')+'</div>'+
    '<div class="total" id="sc-calc" aria-live="polite"></div>'+
    '<div><span class="row-sub">Añadir a</span><div class="routines" role="group" aria-label="Momento de la comida" style="margin-top:6px">'+TYPES.map(tp=>'<button type="button" class="chip-btn" data-action="scan-type" data-t="'+tp+'" aria-pressed="'+(tp===bd.type)+'">'+tp+'</button>').join('')+'</div></div></div>'+
    '<div class="form-error" role="alert"></div><div class="sheet-actions"><button type="button" class="btn ghost" data-action="scan-again">Otro producto</button><button type="button" class="btn primary" data-action="scan-add">Añadir a la comida</button></div>'+
    '<p class="sub attrib">Datos de <b>Open Food Facts</b> (base abierta ODbL, hecha por voluntarios). Pueden contener errores: compáralos con la etiqueta.</p>';
}
function scVals(){
  const p=scn.prod;
  if(p.kcal===null&&p.p===null&&p.c===null&&p.f===null)return null;
  const P=p.p||0,C=p.c||0,F=p.f||0;
  return p.kcal===null?{k:Math.round(4*P+4*C+9*F),p:P,c:C,f:F,est:true}:{k:p.kcal,p:P,c:C,f:F,est:false};
}
function scCalc(){
  const out=$('#sc-calc'),gi=$('#sc-g');if(!out||!gi||!scn.prod)return;
  const g=numOf(gi),v=scVals();
  if(!v){out.textContent='No hay valores nutricionales. Complétalos en «Corregir valores».';return;}
  if(!(g>0)){out.textContent='Indica la cantidad en gramos.';return;}
  const m=g/100;
  out.innerHTML='<b>'+n0(v.k*m)+' kcal</b> · P '+n1(v.p*m)+' g · C '+n1(v.c*m)+' g · G '+n1(v.f*m)+' g'+(v.est?' <span class="sub">(calorías estimadas)</span>':'');
}
function scSaveFood(v,toggleFav){
  const p=scn.prod;
  let fd=scLocal(p.code);
  const brandIn=p.brand&&key(p.name).indexOf(key(p.brand))>=0;
  const nm=(p.name+(p.brand&&!brandIn?' ('+p.brand+')':'')).slice(0,60);
  if(!fd){
    let name=nm;if(findFood(name))name=nm.slice(0,52)+' · '+p.code.slice(-4);
    fd={id:uid(),name:name,kcal:v.k,p:v.p,c:v.c,f:v.f,base:false,fav:false,code:p.code,src:'off'};db.foods.push(fd);
  }else{fd.kcal=v.k;fd.p=v.p;fd.c=v.c;fd.f=v.f;}
  if(typeof p.fi==='number'&&p.fi>=0)fd.fi=p.fi;
  const miss=missOf(p);fd.miss=miss.length?miss:undefined;
  if(p.edited)fd.edited=true;
  if(toggleFav)fd.fav=!fd.fav;
  return fd;
}
function scAdd(){
  const root=$('#sc'),g=numOf($('#sc-g')),v=scVals();
  setErr(root,'');
  if(!(g>0&&g<=5000))return setErr(root,'Indica una cantidad en gramos entre 1 y 5000.',$('#sc-g'));
  if(!v)return setErr(root,'Este producto no tiene valores nutricionales. Complétalos con la etiqueta.',$('#sc-k'));
  const fd=scSaveFood(v,false);
  bd.tray.push(trayItem(fd,g));
  fd.lastG=g;save();
  bd.mode=null;bd.sel=null;
  bdMount();
  toast(bd.pick?'Añadido. Pulsa «Listo» cuando termines.':'Añadido a '+bd.type.toLowerCase()+'. Revisa y guarda la comida.');
}
function scanInput(t){
  if(!scn.prod||!t.id||t.id.indexOf('sc-')!==0)return false;
  if(t.id==='sc-g'){scn.g=parseFloat(t.value)||scn.g;scCalc();return true;}
  if(t.id==='sc-name'){scn.prod.name=t.value;return true;}
  const k={'sc-k':'kcal','sc-p':'p','sc-c':'c','sc-f':'f'}[t.id];
  if(k){const v=t.value===''?null:parseFloat(t.value);scn.prod[k]=(v!==null&&v>=0)?v:null;scn.prod.edited=true;scn.prod.doubt=false;scn.prod.kj=false;
    const p=scn.prod;$('#sc-per100').textContent='Por 100 g: '+(p.kcal===null?'—':n0(p.kcal))+' kcal · P '+dash(p.p)+' g · C '+dash(p.c)+' g · G '+dash(p.f)+' g';scCalc();return true;}
  return false;
}
function scanKey(id,e){
  if(id==='sc-code'){e.preventDefault();scanAction('scan-lookup');return true;}
  if(id==='sc-g'&&scn.prod){e.preventDefault();scAdd();return true;}
  return false;
}
function scanOpen(el){
  const inB=!!(sheetEl&&$('#bd',sheetEl)&&bd);
  if(inB){bd.favChk=$('#bd-fav')?$('#bd-fav').checked:false;}
  else bdInit({type:el&&el.dataset&&el.dataset.type});
  scn.ctx=inB?'builder':'standalone';scn.view='scan';scn.err='';scn.prod=null;
  scanShow(true);
}
function scanBack(){
  scanStop();if(scn.ctl){scn.ctl.abort();scn.ctl=null;}
  if(scn.ctx==='standalone'&&!bd.tray.length&&!bd.rec){closeSheet();bd=null;return;}
  bd.mode=null;bd.sel=null;bdMount();
}
function scanAction(a,el){
  switch(a){
    case 'scan-open':scanOpen(el);break;
    case 'scan-start':scanStart();break;
    case 'scan-stopcam':scanStop();{const c=$('#sc-cam');if(c)c.hidden=true;const s=$('#sc-startbtn'),x=$('#sc-stopbtn');if(s){s.hidden=false;s.disabled=false;s.lastChild.textContent='Activar cámara';}if(x)x.hidden=true;scanSay('Cámara apagada.');}break;
    case 'scan-lookup':{const i=$('#sc-code');scanLookup(i?i.value:'');break;}
    case 'scan-back':scanBack();break;
    case 'scan-again':if(scn.ctl){scn.ctl.abort();scn.ctl=null;}scn.view='scan';scn.err='';scanShow(true);break;
    case 'scan-retry':scanLookup(scn.code);break;
    case 'scan-manual':{bd.newCode=scn.code;bd.newName='';bd.mode='create';bd.sel=null;bdMount();break;}
    case 'scan-recent':{const x=db.scans.find(s=>s.code===el.dataset.code);if(x){scn.code=x.code;scanOpenProd({code:x.code,name:x.name,brand:x.brand,img:safeImg(x.img),qty:'',kcal:x.kcal,p:x.p,c:x.c,f:x.f,doubt:!!x.doubt,kj:!!x.kj});}break;}
    case 'scan-recent-del':{db.scans=db.scans.filter(s=>s.code!==el.dataset.code);save();scn.view='scan';scanShow();break;}
    case 'scan-clear':{db.scans=[];save();scn.view='scan';scanShow();break;}
    case 'scan-edit':{scn.edit=true;$('#sc-edit').hidden=false;el.hidden=true;$('#sc-name').focus();break;}
    case 'scan-g':{const gi=$('#sc-g');if(gi){gi.value=el.dataset.g;scn.g=+el.dataset.g;scCalc();}break;}
    case 'scan-type':{bd.type=el.dataset.t;$$('[data-action=scan-type]',sheetEl).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===bd.type)));break;}
    case 'scan-fav':{const v=scVals();if(!v){setErr($('#sc'),'Rellena primero los valores nutricionales para guardarlo.',$('#sc-k'));break;}
      const fd=scSaveFood(v,true);save();const b=$('#sc-star');if(b)b.outerHTML=scStar(fd.fav);toast(fd.fav?'Guardado en favoritos':'Quitado de favoritos');break;}
    case 'scan-add':scAdd();break;
  }

function splitNames(t){return String(t||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);}
const stem=s=>norm(s).replace(/s\b/g,'');
function matchNames(t){
  const hit=[],miss=[];
  splitNames(t).forEach(n=>{const q=stem(n),m=XCAT.filter(x=>stem(x.n).indexOf(q)>=0||q.indexOf(stem(x.n))>=0);if(m.length)m.forEach(x=>hit.indexOf(x.n)<0&&hit.push(x.n));else miss.push(n);});
  return {hit:hit,miss:miss};
}

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

    v===1?[S('Isquiosurales','bisagra','main'),S('Hombros','empujeV','main'),S('Espalda','tironV','main'),S('Glúteos','puente','sec'),S('Pecho','empujeH','acc'),S('Bíceps','aisl','acc'),S('Core','core','acc')]:

  push:v=>[S('Pecho','empujeH','main'),S('Hombros','empujeV','main'),S('Pecho','empujeH','sec'),S('Hombros','aisl','acc'),S('Pecho','aisl','acc'),S('Tríceps','aisl','acc'),S('Tríceps','aisl','acc')],

};
const SPLITS={1:[['full',0]],2:[['full',0],['full',1]],3:[['full',0],['full',1],['full',2]],4:[['upper',0],['lower',0],['upper',1],['lower',1]],5:[['push',0],['pull',0],['lower',0],['upper',0],['lower',1]],6:[['push',0],['pull',0],['lower',0],['push',1],['pull',1],['lower',1]]};
const SPLIT_NAME={1:'Cuerpo completo',2:'Cuerpo completo',3:'Cuerpo completo',4:'Torso-pierna',5:'Push / Pull / Piernas + Torso-pierna',6:'Push / Pull / Piernas'};
const SESS_NAME={upper:['Torso 1','Torso 2'],lower:['Pierna 1','Pierna 2'],full:['Cuerpo completo 1','Cuerpo completo 2','Cuerpo completo 3'],push:['Push','Push 2'],pull:['Pull','Pull 2']};

function prescribe(goal,lvl,role,comp){
  let s,a,b,r;
  if(goal==='fuerza'){
    if(role==='main'){s=lvl==='princ'?3:lvl==='inter'?4:5;a=lvl==='princ'?5:lvl==='inter'?4:3;b=lvl==='princ'?8:lvl==='inter'?6:5;r=lvl==='princ'?150:lvl==='inter'?180:210;}
    else if(role==='sec'){s=3;a=6;b=8;r=120;}else{s=lvl==='princ'?2:3;a=8;b=12;r=75;}
  }else if(goal==='resist'){
    if(role==='main'){s=lvl==='princ'?2:3;a=12;b=15;r=60;}else if(role==='sec'){s=3;a=15;b=20;r=45;}else{s=lvl==='princ'?2:3;a=15;b=20;r=40;}
  }else{
    const fat=goal==='grasa';
    if(role==='main'){s=lvl==='princ'?3:4;a=comp?6:8;b=comp?10:12;r=comp?(fat?120:150):90;}
    else if(role==='sec'){s=3;a=8;b=12;r=comp?(fat?90:105):75;}
    else{s=lvl==='princ'?2:3;a=fat?12:10;b=15;r=60;}
  }
  if(!comp)r=Math.min(r,90);
  return {sets:s,rmin:a,rmax:b,rest:r};
}
const exSecs=e=>e.sets*(40+e.rest);
const sessMin=s=>6+s.exercises.reduce((t,e)=>t+exSecs(e),0)/60;

function volTarget(g,prof){
  const lvl=prof.level,big=['Pecho','Espalda','Cuádriceps','Glúteos'].indexOf(g)>=0,mid=['Isquiosurales','Hombros'].indexOf(g)>=0;
  let lo,hi;
  if(big){lo={princ:8,inter:10,avanz:12}[lvl];hi={princ:12,inter:16,avanz:20}[lvl];}
  else if(mid){lo={princ:6,inter:8,avanz:10}[lvl];hi={princ:10,inter:14,avanz:18}[lvl];}
  else{lo={princ:4,inter:6,avanz:8}[lvl];hi={princ:8,inter:12,avanz:14}[lvl];}
  const f={masa:1,recomp:1,grasa:0.9,fuerza:0.85,resist:0.75}[prof.goal]||1;
  lo=Math.round(lo*f);hi=Math.round(hi*f);
  if(prof.priority.indexOf(g)>=0){lo+=2;hi+=3;}
  return [lo,hi];
}
function progVolume(p){const v={};PGROUPS.forEach(g=>v[g]=0);p.sessions.forEach(s=>s.exercises.forEach(e=>{v[e.group]=(v[e.group]||0)+e.sets;}));return v;}

function genProgram(prof,opt){
  opt=opt||{};
  const rnd=rng(opt.seed||Date.now()%100000),notes=[],lvlN={princ:1,inter:2,avanz:3}[prof.level]||1;
  let n=Math.min(6,Math.max(1,opt.days||prof.days.length));
  if(prof.level==='princ'&&n>4){notes.push('Como principiante, para empezar recomiendo 3 o 4 días: he usado 4 sesiones por semana. Puedes ampliar más adelante.');n=4;}
  const days=prof.days.slice().sort((a,b)=>WD.indexOf(a)-WD.indexOf(b));
  const spread=(arr,k)=>k>=arr.length?arr.slice():k===1?[arr[Math.floor(arr.length/2)]]:Array.from({length:k},(_,i)=>arr[Math.round(i*(arr.length-1)/(k-1))]);
  const useDays=days.length>=n?spread(days,n):null;
  const have={};prof.equip.forEach(e=>have[e]=1);
  const inj={};prof.inj.forEach(i=>inj[i]=1);
  const pref=matchNames(prof.prefer),avd=matchNames(prof.avoid);
  const prefSet={},avdSet={};pref.hit.forEach(x=>prefSet[x]=1);avd.hit.forEach(x=>avdSet[x]=1);
  if(pref.miss.length)notes.push('No he encontrado en el catálogo estos ejercicios preferidos: '+pref.miss.join(', ')+'.');
  if(avd.miss.length)notes.push('No he encontrado en el catálogo estos ejercicios a evitar: '+avd.miss.join(', ')+'. Revísalos tú en cada sesión.');
  const skipped=[];
  const seq=SPLITS[n].map(x=>({type:x[0],v:x[1]}));
  const sessions=seq.map((x,i)=>({id:uid(),type:x.type,name:SESS_NAME[x.type][x.v]||SESS_NAME[x.type][0],slots:TPL[x.type](x.v)}));
  /* Prioridades: huecos extra para los grupos prioritarios */
  prof.priority.forEach(g=>{
    const region=LOWER.indexOf(g)>=0?LOWER:UPPER,isCore=g==='Core';
    sessions.forEach(s=>s.slots.forEach(sl=>{if(sl.g===g){sl.pri=1;if(sl.role==='acc')sl.role='sec';}}));
    const cand=sessions.filter(s=>isCore||s.slots.some(sl=>region.indexOf(sl.g)>=0));
    cand.sort((a,b)=>b.slots.filter(sl=>sl.g===g).length-a.slots.filter(sl=>sl.g===g).length);
    cand.slice(0,2).forEach(s=>s.slots.push({g:g,pat:g==='Core'?'core':['aisl','puente','post'],role:'acc',pri:1}));
  });
  const weekUsed={};
  sessions.forEach(s=>{
    const used={};s.exercises=[];
    s.slots.forEach(sl=>{
      const pats=[].concat(sl.pat||[]);
      let list=XCAT.filter(x=>x.g===sl.g&&(!pats.length||pats.indexOf(x.p)>=0)&&x.eq.every(e=>have[e])&&!x.st.some(t=>inj[t])&&!avdSet[x.n]&&!used[x.n]);
      const lv=list.filter(x=>x.l<=lvlN);if(lv.length)list=lv;
      if(!list.length){skipped.push(sl.g.toLowerCase());return;}
      const sc=x=>(prefSet[x.n]?4:0)+(sl.role==='main'?(x.c?2:-2):sl.role==='acc'?(x.c?-1:1):0)+(x.l===lvlN?1:0)-(weekUsed[x.n]?2:0)+(prof.goal==='fuerza'&&sl.role==='main'&&x.eq.indexOf('barra')>=0?1:0)+rnd()*1.5;
      list.sort((a,b)=>sc(b)-sc(a));
      const x=list[0],pr=prescribe(prof.goal,prof.level,sl.role,x.c);
      if(!x.eq.length&&prof.goal!=='fuerza'){pr.rmin=Math.max(pr.rmin,10);pr.rmax=Math.max(pr.rmax,LOWER.indexOf(x.g)>=0?20:15);pr.rest=Math.min(pr.rest,90);}
      used[x.n]=1;weekUsed[x.n]=(weekUsed[x.n]||0)+1;
      s.exercises.push({name:x.n,group:x.g,sets:pr.sets,rmin:pr.rmin,rmax:pr.rmax,rest:pr.rest,role:sl.role,pri:sl.pri?1:0,comp:x.c});
    });
  });
  /* Ajuste al tiempo disponible */
  const budget=prof.dur+2;
  sessions.forEach(s=>{
    let guard=30;
    while(sessMin(s)>budget&&s.exercises.length>3&&guard--){
      let i=-1;
      for(let k=s.exercises.length-1;k>=0;k--){if(s.exercises[k].role==='acc'&&!s.exercises[k].pri){i=k;break;}}
      if(i<0)for(let k=s.exercises.length-1;k>=0;k--){if(s.exercises[k].role==='sec'&&!s.exercises[k].pri){i=k;break;}}
      if(i<0)for(let k=s.exercises.length-1;k>=0;k--){if(s.exercises[k].role==='acc'){i=k;break;}}
      if(i<0)break;
      s.exercises.splice(i,1);
    }
    guard=20;
    while(sessMin(s)>budget&&guard--){const e=s.exercises.slice().reverse().find(x=>x.sets>2);if(!e)break;e.sets--;}
    if(sessMin(s)>budget+4)notes.push('«'+s.name+'» no cabe del todo en '+prof.dur+' min (≈ '+Math.round(sessMin(s))+' min). Puedes alargar la sesión o reducir los descansos.');
  });
  /* Equilibrar volumen semanal por grupo */
  const T={};PGROUPS.forEach(g=>T[g]=volTarget(g,prof));
  for(let it=0;it<60;it++){
    const v=progVolume({sessions:sessions});let changed=false;
    for(const g of PGROUPS){
      if(!v[g])continue;
      if(v[g]<T[g][0]){
        const opts=[];sessions.forEach(s=>s.exercises.forEach(e=>{if(e.group===g&&e.sets<5&&sessMin(s)+(40+e.rest)/60<=prof.dur+1)opts.push({s:s,e:e});}));
        opts.sort((a,b)=>a.e.sets-b.e.sets||sessMin(a.s)-sessMin(b.s));
        if(opts.length){opts[0].e.sets++;changed=true;}
      }else if(v[g]>T[g][1]){
        const opts=[];sessions.forEach(s=>s.exercises.forEach(e=>{if(e.group===g&&e.sets>2&&e.role==='acc')opts.push(e);}));
        if(opts.length){opts.sort((a,b)=>b.sets-a.sets);opts[0].sets--;changed=true;}
      }
    }
    if(!changed)break;
  }
  const vol=progVolume({sessions:sessions});
  const low=PGROUPS.filter(g=>vol[g]>0&&vol[g]<T[g][0]).map(g=>g.toLowerCase()+' ('+vol[g]+' de '+T[g][0]+'–'+T[g][1]+')');
  if(low.length)notes.push('Con '+prof.dur+' min y '+n+' '+(n===1?'día':'días')+', el volumen semanal queda por debajo del rango orientativo en: '+low.join(', ')+'. Más tiempo o un día más lo subiría.');
  if(skipped.length)notes.push('Con tu material y tus limitaciones no he podido incluir algunos ejercicios de: '+[...new Set(skipped)].join(', ')+'.');
  PGROUPS.filter(g=>g!=='Core'&&!vol[g]&&prof.priority.indexOf(g)>=0).forEach(g=>notes.push('No hay ejercicios disponibles para '+g.toLowerCase()+' con tu material y limitaciones.'));
  if(prof.inj.length)notes.push('He evitado ejercicios que cargan: '+prof.inj.map(i=>lab(INJ,i).toLowerCase()).join(', ')+'. Es una guía general: si tienes dolor o una lesión, consúltalo con un profesional sanitario.');
  if(n===1)notes.push('Con un solo día, el progreso será limitado: 2 o 3 días mejoran mucho los resultados.');
  if(prof.goal==='grasa'||prof.goal==='recomp')notes.push('Para '+(prof.goal==='grasa'?'perder grasa':'recomposición')+' mantén el entrenamiento de fuerza y complétalo con caminar o cardio suave ('+db.settings.cardioMin+' min/semana es tu objetivo actual). El cardio se registra en la sección Entrenamiento.');
  if(prof.goal==='resist')notes.push('Para mejorar la resistencia, añade 2 o 3 sesiones de cardio de 20–40 min a ritmo cómodo. El cardio se registra en la sección Entrenamiento.');
  /* Días de la semana */
  const dayList=useDays||defaultDays(n);
  sessions.forEach((s,i)=>{s.day=dayList[i]!=null?dayList[i]:null;s.exercises.sort((a,b)=>({main:0,sec:1,acc:2}[a.role]-{main:0,sec:1,acc:2}[b.role]));delete s.slots;});
  const names={};sessions.forEach(s=>{names[s.name]=(names[s.name]||0)+1;});
  const goalTxt=lab(COACH_GOALS,prof.goal);
  const prog=progressionText(prof);
  return {id:uid(),name:SPLIT_NAME[n]+' · '+goalTxt,split:SPLIT_NAME[n],created:Date.now(),status:'draft',startDate:null,goal:prof.goal,level:prof.level,dur:prof.dur,place:prof.place,n:n,targets:T,sessions:sessions,notes:notes,progression:prog,priority:prof.priority.slice()};
}
function defaultDays(n){return ({1:[3],2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,5,6],6:[1,2,3,4,5,6]})[n]||[1,3,5];}
function progressionText(prof){
  const out=[];
  if(prof.level==='princ')out.push('Progresión lineal: cuando completes todas las series en el tope del rango, con buena técnica y 2–3 repeticiones en reserva, sube la carga en la siguiente sesión (≈ 2,5 kg en barra, 1–2 kg por mancuerna o el escalón mínimo de la máquina).');
  else out.push('Doble progresión: primero intenta subir repeticiones dentro del rango; cuando llegues al tope en todas las series, sube la carga y vuelve al límite inferior. Deja 1–2 repeticiones en reserva en la mayoría de series.');
  if(prof.goal==='fuerza')out.push('En los ejercicios principales prioriza subir peso manteniendo la técnica; los accesorios sirven para sostener volumen.');
  if(prof.goal==='resist')out.push('Progresa reduciendo descansos o subiendo repeticiones antes que la carga.');
  out.push('Calienta 5–8 minutos y haz series de aproximación en el primer ejercicio de cada sesión.');
  out.push('Cada 5–8 semanas, o si notas fatiga acumulada, haz una semana ligera con aproximadamente la mitad de las series y la misma carga.');
  out.push('Son pautas generales y no sustituyen a un entrenador o a un profesional sanitario.');
  return out;
}

  if(!p)return;

    '<button type="button" class="icon-btn sm" data-action="coach-sets" data-p="'+key0+'" data-s="'+s.id+'" data-i="'+i+'" data-d="-1" aria-label="Quitar una serie de '+esc(e.name)+'"'+(e.sets<=1?' disabled':'')+'>−</button>'+

let swapCtx=null;
function altsFor(p,s,i){
  const prof=coachProfile(),ex=s.exercises[i],cur=catByName(ex.name);if(!cur||!prof)return [];
  const have={};prof.equip.forEach(e=>have[e]=1);const inj={};prof.inj.forEach(x=>inj[x]=1);
  const avd=matchNames(prof.avoid).hit,pref=matchNames(prof.prefer).hit,inSession=s.exercises.map(e=>e.name),lvl={princ:1,inter:2,avanz:3}[prof.level];
  return XCAT.filter(x=>x.g===cur.g&&x.n!==cur.n&&inSession.indexOf(x.n)<0&&x.eq.every(e=>have[e])&&!x.st.some(t=>inj[t])&&avd.indexOf(x.n)<0&&x.l<=lvl+1&&(cur.p==='aisl'||cur.p==='post'||cur.p==='core'?x.p===cur.p:true))
    .sort((a,b)=>(b.p===cur.p)-(a.p===cur.p)||(pref.indexOf(b.n)>=0)-(pref.indexOf(a.n)>=0)||a.l-b.l);
}
function openSwap(pk,sid,i){
  const p=progById(pk),s=p&&p.sessions.find(x=>x.id===sid);if(!s)return;
  const alts=altsFor(p,s,i);swapCtx={pk:pk,sid:sid,i:i};

/* ---- Semana: planificado vs realizado ---- */
function sessionWorkouts(p,s,ws){const we=addDays(ws,6);return W().filter(w=>!w.demo&&w.date>=ws&&w.date<=we&&(w.sessionId===s.id||(!w.sessionId&&key(w.name)===key(s.name))));}
function cmpSession(s,w){
  const rows=s.exercises.map(e=>{
    const x=w.exercises.find(y=>key(y.name)===key(e.name));
    if(!x)return {e:e,st:'missing',n:0,ok:0};
    const ok=x.sets.filter(t=>t.reps>=e.rmin).length,top=x.sets.reduce((m,t)=>Math.max(m,t.kg||0),0);
    return {e:e,x:x,n:x.sets.length,ok:ok,top:top,st:x.sets.length>=e.sets&&ok>=e.sets?'full':'partial'};
  });
  const extra=w.exercises.filter(y=>!s.exercises.some(e=>key(e.name)===key(y.name)));
  const plan=rows.reduce((t,r)=>t+r.e.sets,0),done=rows.reduce((t,r)=>t+Math.min(r.n,r.e.sets),0);
  return {rows:rows,extra:extra,pct:plan?Math.round(done/plan*100):0,plan:plan,done:done};
}

/* =========================================================
   Entrenador: progresión, sugerencias y comparación con el historial
   Solo usa tus registros reales (no los datos de ejemplo).
   Las sugerencias NUNCA cambian un programa activo sin tu aprobación.
   ========================================================= */
const Wreal=()=>W().filter(w=>!w.demo);
const avgOf=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function exSeries(name,from){
  const k=key(name),out=[];
  Wreal().slice().sort(byAsc).forEach(w=>{
    if(w.date<from)return;
    const e=w.exercises.find(x=>key(x.name)===k);
    if(e){const m=exMetric(e.sets);out.push({date:w.date,m:m.m,kg:m.kg,best:m.best});}
  });
  return out;
}
function exTrend(name,days){
  const ser=exSeries(name,addDays(today(),-days));
  if(ser.length<3)return {st:'pocos',n:ser.length,ser:ser,d:0};
  const span=(parse(ser[ser.length-1].date)-parse(ser[0].date))/864e5,half=Math.max(1,Math.floor(ser.length/2));
  const a=avgOf(ser.slice(0,half).map(x=>x.m)),b=avgOf(ser.slice(-half).map(x=>x.m)),d=a>0?b/a-1:0;
  let st=d>=0.025?'sube':d<=-0.025?'baja':'estancado';
  if(span<14&&st==='estancado')st='pocos';
  return {st:st,d:d,n:ser.length,ser:ser,first:ser[0],last:ser[ser.length-1]};
}
const ST_PILL={sube:['up','▲ Progresando'],estancado:['warn','= Estancado'],baja:['warn','▼ Bajando'],pocos:['','Pocos datos']};
function spark(vals){
  if(vals.length<2)return '';
  const mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>(i/(vals.length-1)*86+2).toFixed(1)+','+(24-(v-mn)/rg*20).toFixed(1)).join(' ');
  return '<svg class="spark" width="90" height="28" viewBox="0 0 90 28" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function weekVol(from){
  const v={};PGROUPS.forEach(g=>v[g]=0);
  Wreal().forEach(w=>{if(w.date>=from&&w.date<=addDays(from,6))w.exercises.forEach(e=>{const g=groupOf(e);v[g]=(v[g]||0)+e.sets.length;});});
  return v;
}
function adherence(a,weeks){
  const ws=weekStart(today());let P=0,D=0;
  for(let k=1;k<=weeks;k++){
    const w0=addDays(ws,-7*k);
    a.sessions.forEach(s=>{
      if(s.day==null)return;
      const date=addDays(w0,WD.indexOf(s.day));
      if(date<a.startDate)return;
      P++;if(sessionWorkouts(a,s,w0).length)D++;
    });
  }
  return {P:P,D:D};
}

/* ---- Sugerencias ---- */
function findEx(a,name){
  for(const s of a.sessions){const i=s.exercises.findIndex(e=>key(e.name)===key(name));if(i>=0)return {s:s,i:i,e:s.exercises[i]};}
  return null;
}
function coachSuggestions(){
  const out=[],a=db.coach.active,dis=db.coach.dismissed||{};
  if(!Wreal().length)return out;
  if(!a)return out;
  const ws=weekStart(today()),v1=weekVol(addDays(ws,-7)),v2=weekVol(addDays(ws,-14)),ad=adherence(a,2);
  const lowAd=ad.P>=2&&ad.D/ad.P<0.6;
  if(lowAd)out.push({id:'adh',title:'Cumples '+ad.D+' de '+ad.P+' sesiones de las últimas 2 semanas',detail:'Un programa que no se puede cumplir no funciona. Prueba con menos días y sesiones que sí puedas hacer.',actions:a.sessions.length>1?[{label:'Crear borrador con '+(a.sessions.length-1)+' '+pl(a.sessions.length-1,'día','días'),kind:'days',n:a.sessions.length-1}]:[]});
  const seen={};let up=0;
  a.sessions.forEach(s=>s.exercises.forEach(e=>{
    if(seen[key(e.name)])return;seen[key(e.name)]=1;
    const t=exTrend(e.name,56);
    if(t.st==='sube')up++;
    if(t.st==='estancado'&&t.n>=4){
      const t0=a.targets[e.group]||[0,99],cur=progVolume(a)[e.group];
      const acts=[];
      if(cur<t0[1]&&e.sets<6)acts.push({label:'Añadir una serie',kind:'addset',name:e.name});
      acts.push({label:'Sustituir por una variante',kind:'swap',name:e.name});
      out.push({id:'stall:'+key(e.name),title:'«'+e.name+'» lleva '+t.n+' sesiones sin mejorar',detail:'Antes de cambiar nada, revisa descanso, sueño, comida y técnica. Si todo está bien, añadir una serie o probar una variante suele reactivar el progreso.',actions:acts});
    }else if(t.st==='baja'&&t.n>=3){
      out.push({id:'down:'+key(e.name),title:'«'+e.name+'» ha bajado un '+n1(Math.abs(t.d)*100)+' %',detail:'Puede ser fatiga o falta de descanso. Si dura varias semanas, considera una semana ligera (la mitad de series con la misma carga).',actions:[{label:'Sustituir por una variante',kind:'swap',name:e.name}]});
    }
  }));
  const cnt=f=>Wreal().filter(w=>w.date>=f&&w.date<=addDays(f,6)).length,active2=cnt(addDays(ws,-7))>=1&&cnt(addDays(ws,-14))>=1;
  if(!lowAd&&active2){
    PGROUPS.slice().sort((x,y)=>((a.targets[y]||[0])[0]-v1[y])-((a.targets[x]||[0])[0]-v1[x])).forEach(g=>{
      const t=a.targets[g],plan=progVolume(a)[g];
      if(!t||!plan)return;
      if(v1[g]<t[0]&&v2[g]<t[0]&&plan<=t[1]&&plan>=1&&out.filter(o=>/^lowvol/.test(o.id)).length<2)out.push({id:'lowvol:'+g,title:'Poco volumen de '+g.toLowerCase(),detail:'Has hecho '+v2[g]+' y '+v1[g]+' series en las dos últimas semanas; lo orientativo para tu nivel es '+t[0]+'–'+t[1]+'. Una serie más en un ejercicio del grupo ayuda a acercarte.',actions:[{label:'Añadir una serie de '+g.toLowerCase(),kind:'addset',g:g}]});
      if(v1[g]>t[1]&&v2[g]>t[1]){
        const down=a.sessions.some(s=>s.exercises.some(e=>e.group===g&&exTrend(e.name,56).st==='baja'));
        if(down)out.push({id:'highvol:'+g,title:'Mucho volumen de '+g.toLowerCase()+' y rendimiento a la baja',detail:'Llevas '+v2[g]+' y '+v1[g]+' series (orientativo '+t[0]+'–'+t[1]+'). Quitar una serie de un accesorio puede mejorar la recuperación.',actions:[{label:'Quitar una serie de '+g.toLowerCase(),kind:'removeset',g:g}]});
      }
    });
  }
  const weeksIn=a.startDate?Math.floor((parse(today())-parse(a.startDate))/864e5/7):0;
  if(weeksIn>=6)out.push({id:'deload',title:'Llevas '+weeksIn+' semanas con este programa',detail:'Cada 5–8 semanas suele convenir una semana ligera (la mitad de las series con la misma carga) y revisar el programa. Puedes crear un borrador nuevo con tu perfil.',actions:[{label:'Crear un borrador nuevo',kind:'gen'}]});
  if(up>=2)out.push({id:'good',title:'Vas bien: progresas en '+up+' ejercicios',detail:'Mantén el programa y sigue la regla de progresión: sube carga cuando llegues al tope del rango en todas las series.',actions:[],info:true});
  return out.filter(x=>!(dis[x.id]&&Date.now()-dis[x.id]<14*864e5));
}
function runSuggestion(id,k){
  const a=db.coach.active,sg=coachSuggestions().find(x=>x.id===id),ac=sg&&sg.actions[k];
  if(!a||!ac)return;
  if(ac.kind==='addset'||ac.kind==='removeset'){
    let tgt=null;
    a.sessions.forEach(s=>s.exercises.forEach((e,i)=>{
      const ok=ac.name?key(e.name)===key(ac.name):e.group===ac.g;

    }));

  }else if(ac.kind==='swap'){const f=findEx(a,ac.name);if(f)openSwap('active',f.s.id,f.i);}

  else if(ac.kind==='gen')coachGenerate();
}
