/* =========================================================
   Calculadora de energía y macros
   BMR: Mifflin-St Jeor. TDEE = BMR × actividad diaria (sin ejercicio) + ejercicio.
   El ejercicio se cuenta una sola vez y en neto (MET − 1), porque el reposo ya está en el BMR.
   Los números son estimaciones; nada cambia en tus objetivos sin que pulses «Aplicar».
   ========================================================= */
const EN=()=>db.energy;
const lbl=(arr,v)=>{const a=arr.find(x=>x[0]===v);return a?a[1]:'—';};
const r10=x=>Math.round(x/10)*10;

function curWeight(){
  const real=db.body.filter(b=>!b.demo&&b.weight>0).sort(byAsc),last=real[real.length-1],p=EN().profile;
  if(p&&p.wSrc!=='manual'&&last)return {kg:last.weight,src:'tu último registro ('+shortDate(last.date)+')'};
  if(p&&p.weight>0)return {kg:p.weight,src:'el que introdujiste a mano'};
  return null;
}
function stepsFactor(s){
  if(s<=STEP_PTS[0][0])return STEP_PTS[0][1];
  for(let i=1;i<STEP_PTS.length;i++){if(s<=STEP_PTS[i][0]){const a=STEP_PTS[i-1],b=STEP_PTS[i];return a[1]+(b[1]-a[1])*(s-a[0])/(b[0]-a[0]);}}
  return STEP_PTS[STEP_PTS.length-1][1];
}
const netKcal=(met,kg,min)=>Math.max(0,met-1)*kg*min/60;
function realSince(n){const from=addDays(today(),-n);return {w:db.workouts.filter(w=>!w.demo&&w.date>from&&w.date<=today()),c:db.cardio.filter(c=>!c.demo&&c.date>from&&c.date<=today())};}

/* Gasto semanal por ejercicio, una sola vez por actividad */
function exerciseWeekly(kg){
  const t=EN().train,parts=[];
  if(t.mode==='auto'){
    const r=realSince(28);let miss=0,k=0;
    r.w.forEach(w=>{const m=w.duration>0?w.duration:(miss++,t.defMin);k+=netKcal(MET_STR[t.strInt],kg,m);});
    parts.push({l:'Fuerza (tus registros, 4 semanas)',k:k/4,n:'Sesiones: '+r.w.length+' ('+n1(r.w.length/4)+' por semana)'+(miss?'. En '+miss+' no pusiste duración y conté '+t.defMin+' min.':'')+' Intensidad: '+lbl(E_INT,t.strInt).toLowerCase()+'.',empty:!r.w.length});
    let ck=0,cm=0,walk=0;r.c.forEach(c=>{const met=MET_CARD[c.type]==null?5:MET_CARD[c.type];if(met===0){walk+=c.min;return;}ck+=netKcal(met,kg,c.min);cm+=c.min;});
    parts.push({l:'Cardio registrado (4 semanas)',k:ck/4,n:n0(cm/4)+' min por semana'+(walk?'. Las caminatas ('+n0(walk/4)+' min/sem) no se suman: ya cuentan en tus pasos.':'.'),empty:!r.c.length});
  }else{
    parts.push({l:'Fuerza (estimación tuya)',k:netKcal(MET_STR[t.strInt],kg,t.strMin)*t.strN,n:t.strN+' sesiones × '+t.strMin+' min, intensidad '+lbl(E_INT,t.strInt).toLowerCase()+'.'});
    parts.push({l:'Cardio (estimación tuya)',k:netKcal(6.5,kg,t.cardioMin),n:t.cardioMin+' min por semana, intensidad moderada.'});
  }
  if(t.hiitMin>0)parts.push({l:'HIIT',k:netKcal(8,kg,t.hiitMin),n:t.hiitMin+' min por semana.'});
  if(t.mindMin>0)parts.push({l:'Pilates o yoga',k:netKcal(2.8,kg,t.mindMin),n:t.mindMin+' min por semana.'});
  if(t.outMin>0){const o=E_OUT.find(x=>x[0]===t.outType)||E_OUT[6];parts.push({l:o[1]+' (fuera del gimnasio)',k:netKcal(o[2]*MET_INT[t.outInt],kg,t.outMin),n:t.outMin+' min por semana, intensidad '+lbl(E_INT,t.outInt).toLowerCase()+'.'});}
  return {parts:parts,total:parts.reduce((s,x)=>s+x.k,0)};
}

function energyCalc(){
  const en=EN(),p=en.profile;
  if(!p)return null;
  const w=curWeight();if(!w)return {need:'peso'};
  const kg=w.kg,bmr=10*kg+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const steps=p.steps>0?p.steps:0,notes=[];let f,fNote;
  if(steps){f=stepsFactor(steps)+JOB_EXTRA[p.job];fNote='Pasos ('+n0(steps)+'/día) y tipo de trabajo. El tiempo caminando ya está incluido en los pasos.';}
  else{f=JOB_BASE[p.job]+(p.move==='alto'?.03:p.move==='bajo'?-.03:0);fNote='Tipo de trabajo y nivel de movimiento, porque no indicaste pasos.';}
  if(p.sitH>=10)f-=.02;else if(p.sitH>0&&p.sitH<=4)f+=.02;
  f=Math.min(1.75,Math.max(1.15,f));
  let walkK=0;if(!steps&&p.walkMin>0)walkK=netKcal(3.5,kg,p.walkMin);
  const neat=bmr*f+walkK,ex=exerciseWeekly(kg),eat=ex.total/7,tdee=neat+eat;
  const maint=r10(tdee),mode=en.goal,lim=E_LIM[mode];
  let adj=en.adj==null?(mode==='gain'?(p.exp==='nov'?10:p.exp==='inter'?7:5):lim[2]):en.adj;
  adj=Math.min(lim[1],Math.max(lim[0],adj));
  const floor=Math.max(bmr,E_FLOOR[p.sex]);let rec=maint*(1+adj/100);
  if(rec<floor){rec=floor;notes.push('El déficit se limitó para no bajar de '+n0(r10(floor))+' kcal, un mínimo prudente.');}
  rec=r10(rec);
  const pk=en.protKg==null?E_PROT[mode]:en.protKg,fk=en.fatKg==null?.8:en.fatKg;
  const P=Math.round(pk*kg),F=Math.round(fk*kg),C=Math.max(0,Math.round((rec-4*P-9*F)/4)),kc=4*P+4*C+9*F;
  if(rec-4*P-9*F<0)notes.push('Con esa proteína y esas grasas no caben carbohidratos en las calorías elegidas. Sube las calorías o baja la proteína o las grasas.');
  else if(C<80)notes.push('Los carbohidratos quedan bajos ('+C+' g). Puede costar rendir y mantener la dieta.');
  if(fk<.6||F*9<.2*kc)notes.push('Las grasas están bajas. Por salud hormonal conviene no bajar de 0,6 g/kg ni del 20 % de las calorías.');
  const bmi=kg/Math.pow(p.height/100,2);if(bmi>=30)notes.push('Con un IMC alto, los g por kg sobre el peso total pueden quedar altos. Valóralo con un profesional sanitario.');
  const wk=(kc-tdee)*7/7700;
  return {kg:kg,wsrc:w.src,bmr:bmr,f:f,fNote:fNote,walkK:walkK,neat:neat,ex:ex,eat:eat,tdee:tdee,maint:maint,adj:adj,lim:lim,rec:kc,floor:floor,P:P,C:C,F:F,pk:pk,fk:fk,wk:wk,notes:notes,mode:mode};
}

/* Objetivos por tipo de día: la media semanal se mantiene igual */
function dayPlan(c){
  const d=EN().days;if(!c||!d.on)return null;
  const T=d.train.filter(x=>d.high.indexOf(x)<0),H=d.high,nT=T.length,nH=H.length,nR=7-nT-nH;
  if(nR<=0||nT+nH===0)return {err:nR<=0?'Deja al menos un día de descanso para compensar las calorías de los otros días.':'Marca al menos un día de entrenamiento o de actividad elevada.'};
  let a=c.rec*d.tPct/100,h=c.rec*d.hPct/100,note='';
  const extra=nT*a+nH*h,maxX=Math.max(0,(c.rec-r10(c.floor))*nR);
  if(extra>maxX){const s=extra>0?maxX/extra:0;a*=s;h*=s;note='Se ajustó la subida para que los días de descanso no bajen de '+n0(r10(c.floor))+' kcal.';}
  const rest=c.rec-(nT*a+nH*h)/nR;
  const mk=k=>{const P=c.P,F=c.F,C=Math.max(0,Math.round((k-4*P-9*F)/4));return {k:4*P+4*C+9*F,p:P,c:C,f:F};};
  const out={train:mk(c.rec+a),rest:mk(rest),high:mk(c.rec+h),nT:nT,nH:nH,nR:nR,note:note};
  out.avg=(nT*out.train.k+nR*out.rest.k+nH*out.high.k)/7;return out;
}
function dayType(date){
  const d=EN().days,w=parse(date).getDay();
  return d.high.indexOf(w)>=0?'high':d.train.indexOf(w)>=0?'train':'rest';
}
const DT_NAME={train:'Día de entrenamiento',rest:'Día de descanso',high:'Día de actividad elevada'};
/* Objetivos que se muestran en la app: los del perfil, o los del tipo de día si los aplicaste */
function goalsFor(date){
  const s=db.settings,ap=EN()&&EN().applied;
  if(ap&&ap.days&&EN().days.on){const t=dayType(date),x=ap.days[t];if(x)return {kcal:x.k,protein:x.p,carbs:x.c,fat:x.f,dayType:t};}
  return {kcal:s.kcal,protein:s.protein,carbs:s.carbs,fat:s.fat,dayType:null};
}

/* ---- Seguimiento ---- */
function slope(pts){
  const n=pts.length,mx=pts.reduce((s,p)=>s+p[0],0)/n,my=pts.reduce((s,p)=>s+p[1],0)/n;
  let nu=0,de=0;pts.forEach(p=>{nu+=(p[0]-mx)*(p[1]-my);de+=(p[0]-mx)*(p[0]-mx);});
  return de?nu/de:0;
}
function energyTrack(c){
  const en=EN(),from=addDays(today(),-42),r=db.body.filter(b=>!b.demo&&b.weight>0&&b.date>=from).sort(byAsc);
  const out={w:r,rate:null,pct:null,span:0};
  if(r.length>=3){
    out.span=(parse(r[r.length-1].date)-parse(r[0].date))/864e5;
    if(out.span>=14){out.rate=slope(r.map(b=>[(parse(b.date)-parse(r[0].date))/864e5,b.weight]))*7;out.pct=out.rate/r[r.length-1].weight*100;}
  }
  const days=Array.from({length:14},(_,i)=>addDays(today(),-1-i));let logged=0,ok=0;
  days.forEach(d=>{const t=db.meals.filter(m=>!m.demo&&!m.planned&&m.date===d).reduce((s,m)=>s+m.kcal,0);if(t>0){logged++;const g=goalsFor(d).kcal;if(g>0&&t>=g*.9&&t<=g*1.1)ok++;}});
  out.logged=logged;out.ok=ok;out.adh=logged>=5?ok/logged:null;
  const rs=realSince(28);out.sess=rs.w.length/4;
  const wa=r.filter(b=>b.waist>0);out.waist=wa.length>=2?wa[wa.length-1].waist-wa[0].waist:null;
  out.sug=[];
  if(!c||!en.applied)return out;
  const since=(parse(today())-parse(en.applied.date))/864e5;
  if(since<14||out.rate==null)return out;
  const mode=en.goal,lim=c.lim,adjNow=c.adj;
  if(out.adh!=null&&out.adh<.6){out.sug.push({id:'adh',title:'Tu cumplimiento de calorías es del '+Math.round(out.adh*100)+' %',detail:'Antes de tocar los objetivos, intenta acercarte a ellos unos días. Si no los cumples, los resultados no dicen si están bien calculados.',to:null});return out;}
  const pc=out.pct;let to=null,why='';
  if(mode==='loss'){if(pc>-.15){to=adjNow-5;why='Tu peso apenas baja ('+sgn(out.rate)+' kg por semana).';}else if(pc<-1){to=adjNow+5;why='Pierdes peso demasiado rápido ('+sgn(out.rate)+' kg por semana).';}}
  else if(mode==='gain'){if(pc<.05){to=adjNow+3;why='Tu peso apenas sube ('+sgn(out.rate)+' kg por semana).';}else if(pc>.5){to=adjNow-3;why='Subes más rápido de lo prudente ('+sgn(out.rate)+' kg por semana).';}}
  else if(Math.abs(pc)>.3){to=adjNow+(pc>0?-3:3);why='Tu peso cambia '+sgn(out.rate)+' kg por semana y buscabas estabilidad.';}
  if(to==null)out.sug.push({id:'ok',title:'Vas en la dirección esperada',detail:'Tu peso cambia '+sgn(out.rate)+' kg por semana, dentro de lo previsto para tu objetivo. No hace falta ajustar.',to:null,info:true});
  else{
    const tc=Math.min(lim[1],Math.max(lim[0],to));
    if(tc===adjNow)out.sug.push({id:'lim',title:why,detail:'Ya estás en el límite prudente del ajuste ('+(adjNow>0?'+':'')+adjNow+' %). Revisa el conteo de pasos y de comidas, y si te preocupa, consulta con un profesional.',to:null});
    else out.sug.push({id:'adj'+tc,title:why,detail:'Propongo cambiar el ajuste de '+(adjNow>0?'+':'')+adjNow+' % a '+(tc>0?'+':'')+tc+' %. Se recalcula el objetivo, pero no se aplica hasta que lo confirmes.',to:tc});
  }
  const dis=en.dismissed||{};out.sug=out.sug.filter(x=>!(dis[x.id]&&Date.now()-dis[x.id]<14*864e5));
  return out;
}

/* ---- Aplicar a objetivos (siempre con confirmación y deshacer) ---- */
const enSnap=()=>JSON.stringify({s:db.settings,e:db.energy});
const enRestore=s=>{const o=JSON.parse(s);db.settings=o.s;db.energy=o.e;save();render();};
function energyApply(){
  const c=energyCalc();if(!c||c.need)return;
  const dp=dayPlan(c),s=db.settings,en=EN();
  if(dp&&dp.err)return toast(dp.err);
  const txt='Tus objetivos diarios pasarán de '+n0(s.kcal)+' kcal (P '+n0(s.protein)+' · C '+n0(s.carbs)+' · G '+n0(s.fat)+') a '+n0(c.rec)+' kcal (P '+c.P+' · C '+c.C+' · G '+c.F+')'+(dp?', con valores distintos según el tipo de día':'')+'. Tus registros anteriores no cambian.';
  confirmSheet('¿Actualizar tus objetivos?',txt,'Aplicar',false,()=>{
    const snap=enSnap();
    db.settings=Object.assign({},db.settings,{kcal:c.rec,protein:c.P,carbs:c.C,fat:c.F,customized:true});
    en.applied={date:today(),base:{k:c.rec,p:c.P,c:c.C,f:c.F},days:dp?{train:dp.train,rest:dp.rest,high:dp.high}:null};
    save();render();toast('Objetivos actualizados',()=>enRestore(snap));
  });
}
const sameAsApplied=c=>{const s=db.settings;return c&&!c.need&&s.kcal===c.rec&&s.protein===c.P&&s.carbs===c.C&&s.fat===c.F&&((EN().applied&&EN().applied.days)?!!dayPlan(c)&&!dayPlan(c).err:!EN().days.on);};

/* ---- Interfaz ---- */
const E_TABS=[['calculo','Cálculo'],['datos','Datos y actividad'],['dias','Por tipo de día'],['seguimiento','Seguimiento']];

const needEnergy=()=>'<section class="card"><div class="empty"><p><b>Empieza por tus datos.</b> Con tu edad, sexo, altura, peso y tu actividad diaria calculo tu metabolismo basal y tu gasto total. Todo se puede editar después.</p><button type="button" class="btn primary" data-action="energy-edit">Rellenar mis datos</button></div></section>';
const stepBtn=(act,d,lab)=>'<button type="button" class="icon-btn bordered" data-action="'+act+'" data-d="'+d+'" aria-label="'+lab+'">'+(d>0?'+':'−')+'</button>';
function enTabCalculo(){
  const en=EN(),c=energyCalc();
  if(!c)return needEnergy();
  if(c.need)return '<section class="card"><div class="empty"><p>Falta tu peso. Regístralo en Progreso o escríbelo en tus datos.</p><button type="button" class="btn primary" data-action="energy-edit">Editar mis datos</button></div></section>';
  const s=db.settings,ks=c.P*4+c.C*4+c.F*9,pc=v=>Math.round(v/ks*100);
  const goalChips='<div class="routines" role="group" aria-label="Objetivo">'+E_GOAL.map(g=>'<button type="button" class="chip-btn" data-action="energy-goal" data-g="'+g[0]+'" aria-pressed="'+(en.goal===g[0])+'">'+g[1]+'</button>').join('')+'</div>';
  const adjRow=c.lim[0]===c.lim[1]?'':'<div class="kv"><span>Ajuste sobre mantenimiento <span class="hint">· entre '+c.lim[0]+' % y '+(c.lim[1]>0?'+':'')+c.lim[1]+' %</span></span><span class="stepper">'+stepBtn('energy-adj',-1,'Bajar el ajuste')+'<b>'+(c.adj>0?'+':'')+c.adj+' %</b>'+stepBtn('energy-adj',1,'Subir el ajuste')+'</span></div>';
  const kc=Math.abs(c.wk)<.05?'Peso estable':(c.wk>0?'Subida':'Bajada')+' prevista: unos '+n1(Math.abs(c.wk))+' kg por semana';
  const top='<section class="card"><div class="card-head"><h2>Tus necesidades</h2><span class="sub">Peso usado: '+n1(c.kg)+' kg</span></div><div class="stats">'+
    '<div class="stat"><div class="k">Metabolismo basal</div><div class="v">'+n0(c.bmr)+' <small>kcal</small></div></div>'+
    '<div class="stat"><div class="k">Gasto total (TDEE)</div><div class="v">'+n0(c.tdee)+' <small>kcal</small></div></div>'+
    '<div class="stat"><div class="k">Mantenimiento</div><div class="v">'+n0(c.maint)+' <small>kcal</small></div></div>'+
    '<div class="stat"><div class="k">Recomendado</div><div class="v">'+n0(c.rec)+' <small>kcal</small></div><div class="s">'+kc+'</div></div></div></section>';
  const set='<section class="card"><div class="card-head"><h2>Tu objetivo</h2></div>'+goalChips+'<div style="margin-top:8px">'+adjRow+
    '<div class="kv"><span>Proteína <span class="hint">· g por kg</span></span><span class="stepper">'+stepBtn('energy-prot',-1,'Menos proteína')+'<b>'+n1(c.pk).replace('.',',')+'</b>'+stepBtn('energy-prot',1,'Más proteína')+'</span></div>'+
    '<div class="kv"><span>Grasas <span class="hint">· g por kg</span></span><span class="stepper">'+stepBtn('energy-fat',-1,'Menos grasas')+'<b>'+n1(c.fk).replace('.',',')+'</b>'+stepBtn('energy-fat',1,'Más grasas')+'</span></div></div>'+
    '<div class="macros" style="margin-top:16px"><div class="macro"><div class="macro-top"><span class="macro-name"><i class="dot p"></i>Proteínas</span><span class="macro-val"><b>'+c.P+'</b> g · '+pc(c.P*4)+' %</span></div></div><div class="macro"><div class="macro-top"><span class="macro-name"><i class="dot c"></i>Carbohidratos</span><span class="macro-val"><b>'+c.C+'</b> g · '+pc(c.C*4)+' %</span></div></div><div class="macro"><div class="macro-top"><span class="macro-name"><i class="dot f"></i>Grasas</span><span class="macro-val"><b>'+c.F+'</b> g · '+pc(c.F*9)+' %</span></div></div></div>'+
    (c.notes.length?'<ul class="notes">'+c.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'')+
    '<div class="kv" style="margin-top:8px"><span>Objetivos actuales en la app</span><span>'+n0(s.kcal)+' kcal · P '+n0(s.protein)+' · C '+n0(s.carbs)+' · G '+n0(s.fat)+'</span></div>'+
    '<div class="cta-row" style="margin-top:14px"><button type="button" class="btn primary" data-action="energy-apply"'+(sameAsApplied(c)?' disabled':'')+'>'+(sameAsApplied(c)?'Ya aplicados':'Aplicar a mis objetivos')+'</button><button type="button" class="btn ghost" data-action="energy-manual">Ajustar a mano…</button></div></section>';
  const ex=c.ex.parts.map(x=>'<div class="kv"><span>'+esc(x.l)+'<br><span class="sub">'+esc(x.n)+(x.empty?' Sin datos todavía.':'')+'</span></span><span>'+n0(x.k/7)+' kcal/día</span></div>').join('');
  const how='<section class="card"><div class="card-head"><h2>Cómo se calcula</h2></div><details><summary>Ver el cálculo paso a paso</summary><div style="margin-top:10px">'+
    '<p class="sub"><b>1. Metabolismo basal (Mifflin-St Jeor).</b> 10 × peso + 6,25 × altura − 5 × edad '+(en.profile.sex==='m'?'+ 5':'− 161')+' = <b>'+n0(c.bmr)+' kcal</b>. Es lo que gastas en reposo.</p>'+
    '<p class="sub"><b>2. Actividad diaria sin ejercicio.</b> Factor × '+n1(c.f).replace('.',',')+' ('+esc(c.fNote)+')'+(c.walkK?' Más '+n0(c.walkK)+' kcal por caminar.':'')+' = <b>'+n0(c.neat)+' kcal</b>.</p>'+
    '<p class="sub"><b>3. Ejercicio</b>, contado una sola vez y en neto (MET − 1, porque el reposo ya está en el basal):</p>'+ex+
    '<p class="sub"><b>4. Gasto total</b> = '+n0(c.neat)+' + '+n0(c.eat)+' = <b>'+n0(c.tdee)+' kcal</b>. Mantenimiento: '+n0(c.maint)+' kcal.</p>'+
    '<p class="sub"><b>5. Objetivo.</b> '+n0(c.maint)+' × (1 '+(c.adj<0?'−':'+')+' '+Math.abs(c.adj)/100+') ≈ '+n0(c.rec)+' kcal. Proteína: '+n1(c.pk).replace('.',',')+' g/kg × '+n1(c.kg)+' kg. Grasas: '+n1(c.fk).replace('.',',')+' g/kg. Carbohidratos: lo que falta hasta las calorías (4 kcal/g de proteína y carbohidratos, 9 kcal/g de grasas).</p>'+
    '<p class="sub">Son estimaciones. Los MET (gasto por actividad) y los factores de actividad son valores orientativos, y las pantallas de relojes y máquinas también se equivocan. Lo que manda es cómo evoluciona tu peso en varias semanas: mira Seguimiento.</p></div></details></section>';
  return top+set+how;
}

    '<p class="sub" style="margin-top:10px">Media semanal: <b>'+n0(dp.avg)+' kcal</b> frente a '+n0(c.rec)+' del objetivo.'+(dp.note?' '+esc(dp.note):'')+'</p>'+
    '<div class="cta-row" style="margin-top:12px"><button type="button" class="btn primary" data-action="energy-apply"'+(sameAsApplied(c)?' disabled':'')+'>'+(sameAsApplied(c)?'Ya aplicados':'Aplicar a mis objetivos')+'</button></div></section>');

function enTabSeg(){

  const t=energyTrack(c),f=x=>x==null?'—':x;
  const stats='<section class="card"><div class="card-head"><h2>Tu evolución</h2><span class="sub">Últimas 6 semanas · solo registros reales</span></div><div class="stats">'+
    '<div class="stat"><div class="k">Peso por semana</div><div class="v">'+(t.rate==null?'—':sgn(t.rate)+' <small>kg</small>')+'</div><div class="s">'+(t.rate==null?'Necesito 3 pesos en 2 semanas ('+t.w.length+' ahora)':t.w.length+' registros')+'</div></div>'+

    '<div class="stat"><div class="k">Entrenos por semana</div><div class="v">'+n1(t.sess)+'</div></div>'+
    '<div class="stat"><div class="k">Cintura</div><div class="v">'+(t.waist==null?'—':sgn(t.waist)+' <small>cm</small>')+'</div></div></div>'+
    (db.body.some(b=>b.demo)?'<p class="info-box">Los registros de ejemplo no se usan para analizar.</p>':'')+'</section>';
  let sg;
  if(!en.applied)sg='<div class="empty"><p>Aplica tus objetivos desde Cálculo. Tras 2 semanas, comparo tu peso con lo previsto y te propongo ajustes.</p></div>';
  else if(!t.sug.length)sg='<div class="empty"><p>'+(t.rate==null?'Aún no hay datos suficientes para sugerir ajustes. Registra tu peso al menos tres veces en dos semanas.':'Por ahora no hay ajustes que sugerir.')+'</p></div>';
  else sg=t.sug.map(x=>'<div class="sug"><div class="row-title">'+esc(x.title)+'</div><p class="sub" style="margin:4px 0 8px">'+esc(x.detail)+'</p><div class="actions" style="justify-content:flex-start;gap:8px">'+(x.to!=null?'<button type="button" class="btn ghost small" data-action="energy-sug" data-to="'+x.to+'">Ver y aplicar</button>':'')+'<button type="button" class="link" data-action="energy-sug-no" data-id="'+esc(x.id)+'">Ahora no</button></div></div>').join('');
  return stats+'<section class="card"><div class="card-head"><h2>Sugerencias</h2><span class="sub">Nada cambia sin tu aprobación</span></div>'+sg+'</section>';
}

function saveEnergy(f){
  clearErr(f);const E=f.elements,en=EN(),chk=(n,l,mn,mx,req)=>{const v=numOf(E[n]);if(v===null)return req?(setErr(f,'Rellena '+l.toLowerCase()+'.',E[n]),false):0;if(!(v>=mn&&v<=mx)){setErr(f,l+' debe estar entre '+mn+' y '+mx+'.',E[n]);return false;}return v;};
  const age=chk('age','La edad',18,90,1);if(age===false)return;
  const height=chk('height','La altura',120,230,1);if(height===false)return;
  const hasLog=!!E.wlog,useLog=hasLog&&E.wlog.checked;
  let weight=chk('weight','El peso',30,300,!useLog);if(weight===false)return;
  const sitH=chk('sitH','Las horas sentada',0,24,1);if(sitH===false)return;
  const steps=chk('steps','Los pasos',0,40000,0);if(steps===false)return;
  const walkMin=chk('walkMin','Los minutos caminando',0,600,0);if(walkMin===false)return;
  const nums={};for(const r of [['strN','Las sesiones de fuerza',0,14],['strMin','Los minutos por sesión',10,240],['cardioMin','El cardio',0,1500],['hiitMin','El HIIT',0,600],['mindMin','Pilates o yoga',0,1200],['outMin','La actividad fuera del gimnasio',0,1500]]){const v=chk(r[0],r[1],r[2],r[3],0);if(v===false)return;nums[r[0]]=r[0]==='strMin'&&!v?60:v;}
  const wasNew=!en.profile;
  en.profile={age:Math.round(age),sex:E.sex.value,height:height,weight:weight||null,wSrc:useLog?'log':'manual',exp:E.exp.value,job:E.job.value,sitH:sitH,steps:steps||0,walkMin:walkMin||0,move:E.move.value,updated:today()};
  en.train=Object.assign({},en.train,nums,{mode:E.tmode.value,strInt:E.strInt.value,outType:E.outType.value,outInt:E.outInt.value});
  if(en.train.mode==='auto'&&!realSince(28).w.length&&!realSince(28).c.length)toast('Aún no hay entrenos reales en 4 semanas. Si quieres, usa «Una estimación mía».');
  if(wasNew)en.adj=null;
  save();closeSheet();ui.enTab='calculo';render();
}

function enManHint(){
  const f=$('form[data-form=energyman]');if(!f||!$('#en-hint'))return;
  const E=f.elements,est=4*(numOf(E.p)||0)+4*(numOf(E.c)||0)+9*(numOf(E.f)||0),k=numOf(E.kcal)||0,c=energyCalc();
  $('#en-hint').textContent='Tus macros suman ≈ '+n0(est)+' kcal'+(k?(Math.abs(est-k)<=k*.05?', en línea con las calorías.':', frente a '+n0(k)+' kcal escritas.'):'.')+(c&&!c.need&&numOf(E.p)?' Proteína: '+n1(numOf(E.p)/c.kg)+' g/kg.':'');
}
function saveEnergyManual(f){
  clearErr(f);const E=f.elements,o={},rules=[['kcal','Las calorías',800,6000],['p','Las proteínas',0,1000],['c','Los carbohidratos',0,1000],['f','Las grasas',0,1000]];
  for(const r of rules){const v=numOf(E[r[0]]);if(v===null||!(v>=r[2]&&v<=r[3]))return setErr(f,r[1]+' deben estar entre '+r[2]+' y '+r[3]+'.',E[r[0]]);o[r[0]]=Math.round(v);}
  const snap=enSnap();
  db.settings=Object.assign({},db.settings,{kcal:o.kcal,protein:o.p,carbs:o.c,fat:o.f,customized:true});
  EN().applied={date:today(),base:{k:o.kcal,p:o.p,c:o.c,f:o.f},days:null,manual:true};
  save();closeSheet();render();toast('Objetivos guardados',()=>enRestore(snap));
}

function energyAction(a,el){
  const en=EN(),d=parseInt(el.dataset.d,10);
  switch(a){
    case 'energy-tab':ui.enTab=el.dataset.t;render();window.scrollTo(0,0);break;
    case 'energy-edit':openEnergyEdit();break;
    case 'energy-goal':en.goal=el.dataset.g;en.adj=null;en.protKg=null;save();render();break;
    case 'energy-adj':{const c=energyCalc();if(c&&!c.need){en.adj=Math.min(c.lim[1],Math.max(c.lim[0],c.adj+d));save();render();}break;}
    case 'energy-prot':{const c=energyCalc();if(c&&!c.need){en.protKg=Math.round(Math.min(2.6,Math.max(1.2,c.pk+d*.1))*10)/10;save();render();}break;}
    case 'energy-fat':{const c=energyCalc();if(c&&!c.need){en.fatKg=Math.round(Math.min(1.5,Math.max(.5,c.fk+d*.1))*10)/10;save();render();}break;}
    case 'energy-tpct':en.days.tPct=Math.min(20,Math.max(0,en.days.tPct+d));save();render();break;
    case 'energy-hpct':en.days.hPct=Math.min(20,Math.max(0,en.days.hPct+d));save();render();break;
    case 'energy-apply':energyApply();break;
    case 'energy-manual':openEnergyManual();break;
    case 'energy-sug':{
      const c=energyCalc(),to=parseInt(el.dataset.to,10);if(!c||c.need)break;
      const prev=en.adj;en.adj=to;const n=energyCalc();en.adj=prev;
      confirmSheet('¿Aplicar este ajuste?','El objetivo pasaría de '+n0(c.rec)+' a '+n0(n.rec)+' kcal (P '+n.P+' · C '+n.C+' · G '+n.F+'). Tus objetivos cambian solo si aceptas.','Aplicar ajuste',false,()=>{
        const snap=enSnap();en.adj=to;const c2=energyCalc(),dp=dayPlan(c2);
        db.settings=Object.assign({},db.settings,{kcal:c2.rec,protein:c2.P,carbs:c2.C,fat:c2.F,customized:true});
        en.applied={date:today(),base:{k:c2.rec,p:c2.P,c:c2.C,f:c2.F},days:dp&&!dp.err?{train:dp.train,rest:dp.rest,high:dp.high}:null};
        save();render();toast('Ajuste aplicado',()=>enRestore(snap));
      });break;}
    case 'energy-sug-no':en.dismissed=en.dismissed||{};en.dismissed[el.dataset.id]=Date.now();save();render();toast('Sugerencia aplazada 14 días');break;
  }
}
function energyChange(t){
  if(t.dataset&&t.dataset.enOn!==undefined){EN().days.on=t.checked;save();render();return true;}
  if(t.dataset&&t.dataset.enDay){const d=EN().days,arr=d[t.dataset.enDay],v=parseInt(t.value,10),i=arr.indexOf(v);
    if(t.checked&&i<0)arr.push(v);else if(!t.checked&&i>=0)arr.splice(i,1);
    if(t.checked){const o=t.dataset.enDay==='train'?d.high:d.train,j=o.indexOf(v);if(j>=0&&t.dataset.enDay==='high')o.splice(j,1);}
    save();render();return true;}
  return false;
}


/* =========================================================
   Recetas: biblioteca, ficha, editor, versiones
   Los macros salen SIEMPRE de los valores por 100 g de tu base de alimentos
   (lo escaneado incluido). La fibra solo se suma de los ingredientes que la tienen.
   ========================================================= */
const RC=()=>vis(db.recipes).slice();
const rcById=id=>db.recipes.find(r=>r.id===id);
const fmtG=g=>g>=10?n0(g):n1(g);
const clone2=o=>JSON.parse(JSON.stringify(o));
function rcCalc(items,servings){
  const s=sumItems(items),sv=servings>0?servings:1;
  let fi=0,known=0;items.forEach(i=>{if(typeof i.fi==='number'){known++;fi+=i.g/100*i.fi;}});
  return {tot:{kcal:s.kcal,p:s.p,c:s.c,f:s.f,fi:known?fi:null},per:{kcal:s.kcal/sv,p:s.p/sv,c:s.c/sv,f:s.f/sv,fi:known?fi/sv:null},known:known,n:items.length};
}
const scaleItems=(items,m)=>items.map(i=>Object.assign({},i,{g:Math.round(i.g*m*10)/10}));
const perLine=p=>n0(p.kcal)+' kcal · P '+n0(p.p)+' · C '+n0(p.c)+' · G '+n0(p.f);
const rcOrigin=r=>r.demo?['Ejemplo','badge-demo']:r.src==='sug'?['Sugerida por IA','pill']:['Propia','pill up'];
let rd=null;
const rcUi=()=>ui.rc||(ui.rc={tab:'biblio',q:'',meal:'',fav:false,origin:'',open:null,week:null,serv:null,disc:{}});

  const U=rcUi(),all=RC(),q=norm(U.q||'');
  let l=all.filter(r=>(!U.meal||r.meal===U.meal)&&(!U.fav||r.fav)&&(!U.origin||(U.origin==='sug'?r.src==='sug':r.src!=='sug'))&&(!q||norm(r.name+' '+r.tags.join(' ')+' '+r.items.map(i=>i.name).join(' ')).indexOf(q)>=0)).sort((a,b)=>byName(a,b));

function rcPhoto(file){

    const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,s=Math.min(1,560/Math.max(w,h)),c=document.createElement('canvas');

const rcWeek=()=>{const U=rcUi();if(!U.week)U.week=weekStart(today());return U.week;};

const dayMeals=d=>M().filter(m=>m.date===d).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
function dayTot(d){const t={kcal:0,p:0,c:0,f:0};dayMeals(d).forEach(m=>{t.kcal+=m.kcal;t.p+=m.p;t.c+=m.c;t.f+=m.f;});return t;}
function plRow(m){

function rcPlanner(){
  const ws=rcWeek(),days=Array.from({length:7},(_,i)=>addDays(ws,i)),t=today();
  const nav='<div class="datenav" style="margin-bottom:6px"><button type="button" class="icon-btn bordered" data-action="rc-wk" data-d="-1" aria-label="Semana anterior">'+ic('left')+'</button><b style="flex:1;text-align:center">'+shortDate(ws)+' – '+shortDate(addDays(ws,6))+'</b><button type="button" class="icon-btn bordered" data-action="rc-wk" data-d="1" aria-label="Semana siguiente">'+ic('right')+'</button><button type="button" class="btn ghost small" data-action="rc-wk" data-d="0"'+(ws===weekStart(t)?' disabled':'')+'>Hoy</button></div>';
  const tots=days.map(dayTot),goals=days.map(goalsFor),sumK=tots.reduce((s,x)=>s+x.kcal,0),sumG=goals.reduce((s,x)=>s+x.kcal,0);

    }).join('');
    return '<section class="card"><div class="card-head"><h2>'+WDN[parse(d).getDay()]+' '+shortDate(d)+(d===t?' · hoy':'')+(g.dayType?' <span class="sub">· '+DT_NAME[g.dayType].toLowerCase()+'</span>':'')+'</h2></div>'+

  }).join('');
  return head+cards;
}

/* ---- Descubrir: busca en TU biblioteca con tus números reales ---- */
const ALLERG=[['gluten','Gluten',['pan','pasta','avena','trigo','harina','cebada','centeno','cuscus','galleta']],['lactosa','Lácteos',['leche','yogur','queso','skyr','nata','mantequilla','whey','kefir']],['huevo','Huevo',['huevo','clara']],['frutos','Frutos secos y cacahuete',['almendra','nuez','nueces','avellana','anacardo','pistacho','cacahuete']],['pescado','Pescado',['salmon','merluza','atun','pescado','bacalao']],['marisco','Marisco',['gamba','langostino','mejillon','calamar','marisco']],['soja','Soja',['soja','tofu']],['sesamo','Sésamo',['sesamo','tahini','hummus']]];
function remainingToday(){
  const g=goalsFor(today()),e=dayTotals(today(),false),p=dayTotals(today(),true);
  return {g:g,eaten:e,planned:p,kcal:g.kcal-e.kcal-p.kcal,prot:g.protein-e.p-p.p,c:g.carbs-e.c-p.c,f:g.fat-e.f-p.f};
}
function discoverMatches(D){
  const pr=EN().prefs,av=splitCsv(pr.avoid),inc=splitCsv(D.inc),exc=splitCsv(D.exc),al=ALLERG.filter(a=>pr.allerg.indexOf(a[0])>=0);
  const num=v=>v===''||v==null||isNaN(parseFloat(v))?null:parseFloat(v),K=num(D.kcal),P=num(D.prot),C=num(D.carb),F=num(D.fat),T=num(D.time);
  const out=[];
  RC().forEach(r=>{
    const names=r.items.map(i=>norm(i.name)).join(' | ');
    if(al.some(a=>a[2].some(w=>names.indexOf(w)>=0)))return;
    if(av.concat(exc).some(w=>names.indexOf(norm(w))>=0))return;
    if(inc.length&&!inc.every(w=>names.indexOf(norm(w))>=0))return;
    if(D.meal&&r.meal!==D.meal)return;
    if(T!=null&&r.time>T)return;
    const c=rcCalc(r.items,r.servings);let best=null;
    [.5,.75,1,1.25,1.5,2].forEach(por=>{
      const k=c.per.kcal*por,p=c.per.p*por,cc=c.per.c*por,f=c.per.f*por;
      const okK=K==null||k<=K*1.05,okP=P==null||p>=P,okC=C==null||cc<=C,okF=F==null||f<=F;
      const miss=(okK?0:1)+(okP?0:1)+(okC?0:1)+(okF?0:1),dist=(K!=null?Math.abs(K-k)/K:0)+(P!=null?Math.abs(P-p)/Math.max(P,1)*.5:0)+Math.abs(por-1)*.05;
      if(!best||miss<best.miss||(miss===best.miss&&dist<best.dist))best={por:por,miss:miss,dist:dist,k:k,p:p,c:cc,f:f,ok:miss===0};
    });
    out.push({r:r,b:best});
  });
  return out.sort((a,b)=>a.b.miss-b.b.miss||a.b.dist-b.b.dist);
}
const splitCsv=s=>(s||'').split(',').map(x=>x.trim()).filter(Boolean);

    pendiente_hoy:{kcal:Math.round(rem.kcal),proteina_g:Math.round(rem.prot)},objetivo_fisico:c&&!c.need?lbl(E_GOAL,c.mode):null,

  const prefs='<section class="card"><div class="card-head"><h2>Preferencias y restricciones</h2></div><div class="fgrid"><label class="field"><span>Alimentos que no me gustan <span class="hint">· separados por comas</span></span><input data-pref="avoid" autocomplete="off" placeholder="Ej.: coliflor, atún" value="'+esc(pr.avoid)+'"></label><label class="field"><span>Alimentos que me gustan</span><input data-pref="liked" autocomplete="off" placeholder="Ej.: salmón, aguacate" value="'+esc(pr.liked)+'"></label>'+

  const ctx=JSON.stringify(rcContext(),null,1);

    '<details style="margin-top:10px"><summary>Qué haría falta y cómo se conectaría</summary><div style="margin-top:8px"><p class="sub">1) Una cuenta de desarrollador de la API de Claude con crédito (se factura aparte de Claude.ai) y una clave. 2) Un pequeño servidor intermedio que guarde la clave y reciba tu petición, porque la clave no debería quedar en el móvil. 3) La app enviaría el contexto de abajo y pediría una receta con ingredientes y gramos <b>sin macros</b>. 4) La app buscaría cada ingrediente en <b>tu base de alimentos</b> (si no existe, te pediría elegirlo o escanearlo) y calcularía ella los macros definitivos. Las cifras que invente la IA se ignoran. 5) La receta quedaría marcada como «Sugerida por IA», separada de las tuyas.</p></div></details>'+

  return need+form+list+prefs+ia;

function discChange(t){
  const U=rcUi();
  if(t.dataset&&t.dataset.disc){U.disc[t.dataset.disc]=t.value;render();return true;}
  if(t.dataset&&t.dataset.pref){EN().prefs[t.dataset.pref]=t.value.slice(0,200);save();render();return true;}
  if(t.dataset&&t.dataset.allerg){const a=EN().prefs.allerg,i=a.indexOf(t.dataset.allerg);if(t.checked&&i<0)a.push(t.dataset.allerg);else if(!t.checked&&i>=0)a.splice(i,1);save();render();return true;}
  return false;
}

    case 'edit-body':openBody(id);break;
    case 'new-photo':openPhoto();break;
    case 'view-photo':viewPhoto(id);break;
    case 'edit-photo':openPhoto(id);break;
    case 'delete-photo':deletePhoto(id);break;
    case 'delete':del(el.dataset.col,id);break;
    case 'add-exercise':addEx(el);break;
    case 'remove-exercise':{const b=el.closest('.ex'),l=$('#ex-list');if($$('.ex',l).length>1)b.remove();else{$$('input',b).forEach(i=>{i.value='';});}break;}
    case 'add-set':{const b=el.closest('.ex'),sets=$('.sets',b),rows=$$('.set',b),last=rows[rows.length-1];
      sets.insertAdjacentHTML('beforeend',setRow(rows.length+1,{reps:$('.s-reps',last).value,kg:$('.s-kg',last).value}));
      const nr=$$('.set',b);$('.s-reps',nr[nr.length-1]).focus();break;}
    case 'remove-set':{const b=el.closest('.ex'),row=el.closest('.set');if($$('.set',b).length>1){row.remove();renumber(b);}else{$$('input',row).forEach(i=>{i.value='';});}break;}
    case 'use-last':{const b=el.closest('.ex'),f=b.closest('form'),lp=lastPerf($('.ex-name',b).value,f.elements.date.value,f.dataset.id);if(lp)fillSets(b,clone(lp.sets));break;}
    case 'open-profile':openProfile();break;
    case 'open-settings':openSettings();break;
    case 'toggle-demo':db.showDemo=!db.showDemo;save();render();if(sheetEl)openSettings();break;
    case 'delete-demo':confirmSheet('¿Eliminar los datos de ejemplo?','Se borrarán todos los registros con la etiqueta «Ejemplo». Tus propios registros no se tocan.','Eliminar ejemplos',true,()=>{['workouts','meals','body','cardio','routines','favorites','recipes'].forEach(k=>{db[k]=db[k].filter(r=>!r.demo);});save();render();toast('Ejemplos eliminados');});break;
    case 'load-demo':{applySeed(db,seedDemo());db.showDemo=true;save();render();openSettings();break;}
    case 'export':doExport();break;
    case 'import':{const fi=$('#imp-file');if(fi)fi.click();break;}
    case 'import-text':{const t=$('#imp-text');if(t&&t.value.trim())importText(t.value);break;}
    case 'copy-export':{const t=$('#export-text');try{navigator.clipboard.writeText(t.value).then(()=>toast('Texto copiado'),()=>t.select());}catch(err){t.select();}break;}
    case 'wipe':confirmSheet('¿Borrar todos tus datos?','Se eliminarán entrenamientos, cardio, comidas, registros corporales, objetivos y fotos de este navegador. No se puede deshacer.','Borrar todo',true,()=>{
      db=freshDb();db.showDemo=false;ui.exercise=null;ui.group=null;
      idbTx('readwrite',s=>s.clear()).catch(()=>{});photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];
      save();render();toast('Datos borrados');});break;
    case 'confirm-yes':{const f=pendingConfirm;pendingConfirm=null;closeSheet();if(f)f();break;}
    case 'undo':{const f=pendingUndo;pendingUndo=null;$('#toast').classList.remove('show');if(f)f();break;}
    case 'nut-prev':ui.nutDate=addDays(ui.nutDate,-1);render();break;
    case 'nut-next':ui.nutDate=addDays(ui.nutDate,1);render();break;
    case 'nut-today':ui.nutDate=today();render();break;
    case 'range':ui.range=parseInt(el.dataset.days,10)||0;render();break;
    case 'metric':ui.metric=el.dataset.m;render();break;
    case 'exmetric':ui.exMetric=el.dataset.m;render();break;
    case 'pick-group':ui.group=el.dataset.g;render();break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  ({recipe:saveRecipe,rcmeal:saveRcMeal,rcfit:saveFit,rcmove:saveRcMove,rcmenu:saveRcMenu,shopadd:saveShopAdd,energy:saveEnergy,energyman:saveEnergyManual,coach:saveCoachProfile,workout:saveWorkout,routine:saveRoutine,cardio:saveCardio,meal:saveMeal,food:saveFood,body:saveBody,profile:saveProfile,photo:savePhoto})[f.dataset.form](f);
});
document.addEventListener('input',e=>{
  const t=e.target,f=t.closest('form[data-form]');
  if(t.id==='food-q'){const q=norm(t.value);$$('#food-list .fl-row').forEach(r=>{r.hidden=!!q&&norm(r.dataset.n).indexOf(q)<0;});return;}
  if(scanInput(t))return;
  if(recipeInput(t))return;
  if(bd&&$('#bd')){
    if(t.id==='bd-q'){if(bd.mode){bd.mode=null;bd.sel=null;renderCfg();}renderResults();return;}
    if(t.id==='bd-g'){calcCfg();return;}
    if(t.classList.contains('bd-tg')){
      const it=bd.tray[parseInt(t.dataset.i,10)],g=numOf(t);
      if(it){it.g=g>0?g:0;const m=it.g/100;t.closest('.tr-row').querySelector('.row-sub').textContent=n0(it.k*m)+' kcal · P '+n1(it.p*m)+' · C '+n1(it.c*m)+' · G '+n1(it.f*m);renderTotals();}
      return;
    }
  }
  if(!f)return;
  if(f.dataset.form==='meal'){
    if(t.classList.contains('it-name')){const row=t.closest('.it');if(row.dataset.fixed&&row.dataset.fname!==key(t.value))row.dataset.fixed='';}
    refreshMeal(f);
  }
  if(f.dataset.form==='profile')goalHint(f);
  if(f.dataset.form==='energyman')enManHint();
  if(t.classList.contains('ex-name')){
    const b=t.closest('.ex');
    if(b.dataset.g!=='1'){const c=CAT.find(x=>key(x[0])===key(t.value));if(c)$('.ex-group',b).value=c[1];}
    exLast(b);
  }
  if(t.name==='date'&&f.dataset.form==='workout')$$('.ex',f).forEach(exLast);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(coachChange(t))return;
  if(energyChange(t))return;
  if(recipeChange(t))return;
  if(discChange(t))return;
  if(bd&&t.id==='bd-date'){bd.date=t.value;if(bd.date>today()){bd.planned=true;$('#bd-status').value='planned';}renderTotals();return;}
  if(bd&&t.id==='bd-status'){bd.planned=t.value==='planned';renderTotals();return;}
  if(t.id==='nut-date'){ui.nutDate=t.value||today();render();}
  else if(t.id==='ex-sel'){ui.exercise=t.value;render();}
  else if(t.id==='pm-sel'){ui.pm=t.value;render();}
  else if(t.id==='cmp-from'){ui.cmpFrom=t.value;render();}
  else if(t.id==='cmp-to'){ui.cmpTo=t.value;render();}
  else if(t.id==='ph-a'){ui.phA=t.value;render();}
  else if(t.id==='ph-b'){ui.phB=t.value;render();}
  else if(t.classList&&t.classList.contains('ex-group')){const b=t.closest('.ex');if(b)b.dataset.g='1';}
  else if(t.id==='imp-file'&&t.files&&t.files[0]){
    const rd=new FileReader();rd.onload=()=>importText(String(rd.result));rd.onerror=()=>toast('No se pudo leer el archivo');rd.readAsText(t.files[0]);t.value='';
  }
});
document.addEventListener('keydown',e=>{
  if(!sheetEl)return;
  if(e.key==='Escape'){closeSheet();return;}
  if(e.key==='Enter'&&scanKey(e.target.id,e))return;
  if(e.key==='Enter'&&bd&&$('#bd')){
    const id=e.target.id;
    if(id==='bd-q'){e.preventDefault();const first=$('#bd-results [data-action=bd-pick]')||$('#bd-results [data-action=bd-pickfav]');if(first)first.click();return;}
    if(id==='bd-g'){e.preventDefault();bdAdd();return;}
    if(id&&id.indexOf('nf-')===0){e.preventDefault();bdSaveFood();return;}
  }
  if(e.key==='Tab'){
    const fs=$$('button:not([disabled]),input:not([type=hidden]):not([hidden]),select,textarea,summary,a[href]',sheetEl).filter(x=>x.offsetParent!==null);
    if(!fs.length)return;
    const first=fs[0],last=fs[fs.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)scanStop();});
window.addEventListener('hashchange',()=>{route=routeFromHash();render();window.scrollTo(0,0);});

/* =========================================================
   8. Arranque
   ========================================================= */
render();
loadPhotos();
(async()=>{try{if(window.claude&&window.claude.use)downloads=await window.claude.use('downloads');}catch(e){downloads=null;}})();
})();
</script>
